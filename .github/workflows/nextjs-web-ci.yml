# Workspace CI — lint, test & build on every PR.
#
#   PR → dev  : Biome lint + Vitest unit tests + production build (baseline gate)
#   PR → main : strict — frozen-lockfile install, Biome with warnings-as-errors,
#               tsc --noEmit, Vitest, production build (promotion gate; main
#               auto-deploys via the Coolify webhook on merge)
#
# pnpm workspace（ルート lockfile）。install は必ずリポジトリルートで実行する。
#
# E2E: `pages` ジョブが 全画面の読み込み確認（tools/docs-screenshots/page-load.spec.ts）
# を使い捨て DB + 本番ビルドで回す。単体試験と build が見ない「開いたら落ちる」を
# ここで止める（撮影用のデモシードもここで全部流れるので、シードの腐りも捕まる）。

name: nextjs-web CI

on:
  pull_request:
    branches: [dev, main]

concurrency:
  group: nextjs-web-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # マージ済みマイグレーションの改変を止める。
  # マイグレーションは merge した瞬間に自動で当たる（db-migrate-dev/-main）ので、
  # base に載っているものは既に本物の DB に適用済み = 取り消せない。
  # あとから書き換えると次のデプロイが P3006 で落ち、しかも落ちるのは
  # 直した本人ではなく「次に merge した誰か」になる。
  migrations:
    name: shared-db — 適用済みマイグレーションの保護
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          # base との差分を見るので履歴が要る
          fetch-depth: 0
      - name: Check applied migrations are untouched
        run: bash shared-db/scripts/check-applied-migrations.sh "origin/${{ github.event.pull_request.base.ref }}"

  # まっさらな DB に本当に当ててみる。差分検査（上）は「触っていないか」しか
  # 見ないので、壊れた新規マイグレーションは merge 後に db-migrate-dev が
  # 止まって初めて分かっていた（b322e9db / 5eabb53b で実際に 2 回）。
  # db-migrate の entrypoint.sh と同じ順（migrate deploy → grants → analytics）
  # で流し、最後に schema と DB の差分が空であることも確かめる。
  # DB 名は grants.sql が `IN DATABASE ckk` を決め打ちしているので ckk。
  # pg_cron は preload されていないので cron 系 SQL は entrypoint と同様に飛ぶ。
  migrate-deploy:
    name: shared-db — まっさらな DB へ migrate deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: groonga/pgroonga:4.0.6-alpine-17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ckk
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d ckk"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:55432/ckk
    defaults:
      run:
        working-directory: shared-db
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: shared-db/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install (shared-db は workspace 外 — 自前の lockfile)
        run: pnpm install --frozen-lockfile --ignore-workspace
      - name: prisma migrate deploy
        run: pnpm exec prisma migrate deploy
      - name: grants.sql / cron 系 / analytics-views.sql（entrypoint.sh と同じ順）
        # entrypoint.sh は pg_cron が preload された DB でだけ sql/*-cron.sql を
        # 流す。CI の postgres には pg_cron が無いので、これまで cron 系 5 本は
        # **まるごと素通り**していた — 構文誤りや消えた列への参照が CI を通り、
        # merge 後の db-migrate で初めて落ちる（#811 が防ぎたかった事故そのもの）。
        #
        # そこで CI だけ cron スキーマのスタブ（ci/pg-cron-stub.sql）を作り、
        # `CREATE EXTENSION pg_cron` の 1 行だけ落として本体を実際に流す。
        # ジョブ本体（$job$ … $job$）は pg_cron でも text として保存されるだけで
        # install 時には解析されないので、ここで捕まるのは**本体の外側** —
        # DDL・cron.job への参照・ファイル自身の構文で、実際に db-migrate を
        # 止めてきたのはそちら。
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f sql/grants.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f ci/pg-cron-stub.sql
          for f in sql/kiosk-cron.sql sql/user-suspension-cron.sql \
                   sql/security-cron.sql sql/portal-cron.sql \
                   sql/user-provision-cron.sql; do
            echo "==> $f"
            sed '/CREATE EXTENSION IF NOT EXISTS pg_cron;/d' "$f" \
              | psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q
          done
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f sql/analytics-views.sql
      - name: schema と DB の差分が空であること
        run: pnpm exec prisma migrate diff --from-config-datasource --to-schema prisma/schema --exit-code

  # base（merge 先）のデータが入った DB へ head の migration を当てる。
  # migrate-deploy ジョブは**空の** DB にしか当てないので、行があると落ちる
  # migration（列を書き換えてから CHECK を張り替える、など）は通ってしまい、
  # dev の db-migrate で初めて落ちる（2026-09-20、20261101090000 の match_aliases）。
  # ここでは base の worktree で使い捨て DB を立てて base の migration + 全デモ
  # シードを流し、その上に head の migration を当てる — デモシードにある表は
  # 「行がある状態」で試される。
  migrate-with-data:
    name: shared-db — base のデータ入り DB へ head の migration を当てる
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: shared-db/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: base を別ディレクトリへ
        run: git worktree add /tmp/base "origin/${{ github.base_ref }}"
      - name: base の shared-db / docs-screenshots を install（どちらも workspace 外）
        run: |
          (cd /tmp/base/shared-db && pnpm install --frozen-lockfile --ignore-workspace)
          (cd /tmp/base/tools/docs-screenshots && pnpm install --frozen-lockfile --ignore-workspace)
      - name: base の migration + 全デモシード（使い捨て DB、残す）
        working-directory: /tmp/base/tools/docs-screenshots
        env:
          SHOT_DB_CONTAINER: ckk-ci-base-db
          SHOT_DB_PORT: "55472"
        run: pnpm docs:seed
      - name: base の grants / analytics-views（本物の DB と同じく「既にビューがある」状態にする）
        # これが無いと head の analytics-views.sql は**ビューが無い DB** にしか当たらず、
        # 既存ビューの途中へ列を足す変更（CREATE OR REPLACE では通らない）が CI を
        # 素通りして db-migrate で初めて落ちる（2026-09-25、v_item_custody_inventory）。
        working-directory: /tmp/base/shared-db
        env:
          DATABASE_URL: postgresql://postgres:shots@127.0.0.1:55472/ckk
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f sql/grants.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f sql/analytics-views.sql
      - name: head の shared-db を install
        working-directory: shared-db
        run: pnpm install --frozen-lockfile --ignore-workspace
      - name: head の migration を当てる → grants / analytics-views
        working-directory: shared-db
        env:
          DATABASE_URL: postgresql://postgres:shots@127.0.0.1:55472/ckk
        run: |
          pnpm exec prisma migrate deploy
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f sql/grants.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f sql/analytics-views.sql
      - name: schema と DB の差分が空であること
        working-directory: shared-db
        env:
          DATABASE_URL: postgresql://postgres:shots@127.0.0.1:55472/ckk
        run: pnpm exec prisma migrate diff --from-config-datasource --to-schema prisma/schema --exit-code
      - name: 後始末
        if: always()
        run: docker rm -f ckk-ci-base-db || true

  authz-core:
    name: authz-core — lint & test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: packages/authz-core
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install (frozen lockfile, workspace root)
        run: pnpm install --frozen-lockfile
        working-directory: .
      - name: Lint (Biome)
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests (Vitest)
        run: pnpm test

  web:
    name: nextjs-web — lint & build (base ${{ github.base_ref }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: coolify/apps/nextjs-web
    steps:
      # fetch-depth: 0 — マイグレーション後方互換ガードが base との差分を
      # 取るため。浅いクローンだと origin/<base> が無く、diff が空になって
      # **ガードが黙って通ってしまう**（守っているつもりで守れていない状態）。
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Reads the pinned pnpm version from the root "packageManager" field.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install (frozen lockfile, workspace root)
        run: pnpm install --frozen-lockfile
        working-directory: .

      - name: Sync Prisma schema (shared-db) + generate client
        run: pnpm db:sync-schema && pnpm db:generate

      - name: Lint (Biome)
        run: pnpm lint

      - name: Unit tests (Vitest)
        run: pnpm test

      - name: Page gate guard (requireAppRead)
        run: bash scripts/check-page-gates.sh

      - name: Server Action gate guard (checkPermission / requireAnyRead)
        run: node scripts/check-server-action-gates.mjs
      - name: API gate guard (requireApiPermission / requireApiAuth)
        run: node scripts/check-api-gates.mjs

      # 監査 C1: 認証の門（next の proxy / next-auth の authorized）に公開済みの
      # advisory が出たまま 2 版滞留していた。本番依存の high 以上で止める。
      # dev 専用の CLI（prisma の mysql2 / deepmerge-ts）は --prod で外れる。
      #
      # 素の `pnpm audit` ではなくラッパーを通す — npm の監査エンドポイントが
      # 落ちている間（2026-09-04 に数十分続いた）は脆弱性ゼロでも
      # ERR_SOCKET_TIMEOUT で赤になり、開いていた PR と昇格 PR を全部止めた。
      # ラッパーは「届かなかった」を ::warning:: にして通し、脆弱性が
      # 見つかったときだけ従来どおり落とす。
      - name: Dependency audit (prod, high+)
        working-directory: .
        run: bash tools/ci/dependency-audit.sh

      # 英語・中国語対応は段階的に進める（数千箇所が未着手のまま残る）。
      # 全部訳し終わっていなくても落とさない — 見るのは **後戻り** だけで、
      # baseline より増えたときに失敗する。使い方は tools/i18n/README.md。
      - name: i18n regression guard (no new Japanese literals)
        run: node ../../../tools/i18n/i18n-scan.mjs

      # 用語集そのものの検査。同じ ja に違う訳が当たっていないか
      # （_specs/i18n-glossary.md が i18n 用語の正 — §2.11 の手順）。
      - name: i18n glossary consistency
        run: node ../../../tools/i18n/i18n-glossary-check.mjs

      # tr() の鍵は本物の next-intl 鍵（messages/ja.json のパス）。
      # 鍵が 5,700 件を超えると next-intl の型付け（AppConfig["Messages"]）が
      # TypeScript の複雑さの上限に触れるため型検査を諦めており（src/global.d.ts）、
      # 実在しない鍵で呼んでいないかはここでしか見られない。
      - name: i18n translation keys exist
        run: node ../../../tools/i18n-unify/verify-keys.mjs

      - name: i18n dynamic key prefixes exist (tr(`ns.${x}`))
        run: node scripts/check-dynamic-i18n-keys.mjs

      # 監査ログ (SY07) が書く表名すべてに audit.table のラベルがあるか。
      # 足し忘れると「対象」列に生のテーブル名が出る。
      - name: audit table labels exist for every recordAudit tableName
        run: node scripts/check-audit-table-labels.mjs

      # "use server" は async 関数しか export できない。定数を export すると
      # クライアントにはアクション参照が渡り、実行時に画面ごと落ちる
      # （tsc も biome も next build も検出しない）。
      - name: Server Action export guard ("use server")
        run: bash scripts/check-use-server-exports.sh

      # マイグレーションは「前のバージョンのアプリでも動く」形であること。
      # デプロイと migrator は同じ merge から並行に走り、どちらが先に着くか
      # 決められない。列を落とす・改名する類は、まだ serving 中の旧コンテナを
      # 壊す。禁止はしないが、migration.sql に
      #   -- allow-destructive: <理由>
      # と書いて意図的だと言わせる。
      - name: Migration backward-compat guard
        run: bash scripts/check-migration-compat.sh "origin/${{ github.base_ref }}"

      # ── strict gates: promotion PRs into main only ──────────────────────
      - name: Lint strict — warnings as errors (main)
        if: github.base_ref == 'main'
        run: pnpm exec biome check --error-on-warnings

      # fumadocs-mdx の生成物 .source/ が無いと tsc が落ちるため、
      # package.json の typecheck スクリプト（fumadocs-mdx && tsc --noEmit）を使う
      - name: Typecheck (main)
        if: github.base_ref == 'main'
        run: pnpm typecheck

      - name: Build (production)
        run: pnpm build

      # pnpm build の先頭がスイムレーン図を DSL から生成し直すので、ここで
      # 差分が出る = コミット済みの SVG が DSL と食い違っている、ということ。
      # デプロイは生成し直した図を使うので本番は正しいままだが、リポジトリの
      # 図が嘘をつくとレビューで気づけない。実際に一度ずれた（2026-08-30 の
      # 用語統一が SVG にだけ当たり、DSL は旧語のまま残っていた）。
      - name: Diagrams are in sync with their DSL
        run: |
          if ! git diff --quiet -- content/manual/assets/diagrams; then
            echo "::error::スイムレーン図がDSLと食い違っています。node tools/swimlane/build-diagrams.mjs を実行して生成物をコミットしてください。"
            git diff --stat -- content/manual/assets/diagrams
            exit 1
          fi
          echo "図は DSL と一致しています"

  # 全画面の読み込み確認 — 使い捨て Postgres（docker run）+ 全デモシード +
  # 本番ビルドの nextjs-web を起動し、静的ルート全部・撮影パス・各一覧の先頭行の
  # 詳細/編集を Playwright で開いて、HTTP エラー・pageerror・console.error・
  # MISSING_MESSAGE 等の本文を合否にする（tools/docs-screenshots/README.md
  # 「全画面の読み込み確認」）。2026-09 の在庫カテゴリ移設・品目統合のように
  # 「型も build も通るのに開くと落ちる」変更を、merge の前に止めるためのもの。
  pages:
    name: nextjs-web — 全画面の読み込み確認 (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install (frozen lockfile, workspace root)
        run: pnpm install --frozen-lockfile
      - name: Install shared-db（workspace 外 — 自前の lockfile）
        run: pnpm install --frozen-lockfile --ignore-workspace
        working-directory: shared-db
      - name: Install docs-screenshots（workspace 外）+ Chromium
        run: |
          pnpm install --frozen-lockfile --ignore-workspace
          pnpm exec playwright install --with-deps chromium
        working-directory: tools/docs-screenshots
      - name: Sync Prisma schema (shared-db) + generate client
        run: pnpm db:sync-schema && pnpm db:generate
        working-directory: coolify/apps/nextjs-web
      - name: Seed → build → start → page-load.spec.ts
        run: pnpm e2e:pages
        working-directory: tools/docs-screenshots
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: page-load-report
          path: /tmp/page-load-report.json
          if-no-files-found: ignore

  kiosk:
    name: nextjs-kiosk — lint & build (base ${{ github.base_ref }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: coolify/apps/nextjs-kiosk
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install (frozen lockfile, workspace root)
        run: pnpm install --frozen-lockfile
        working-directory: .

      - name: Sync Prisma schema (shared-db) + generate client
        run: pnpm db:sync-schema && pnpm db:generate

      - name: Lint (Biome)
        run: pnpm lint

      # twin ファイルのドリフト検知を含む
      - name: Unit tests (Vitest)
        run: pnpm test

      - name: Lint strict — warnings as errors (main)
        if: github.base_ref == 'main'
        run: pnpm exec biome check --error-on-warnings

      - name: Typecheck (main)
        if: github.base_ref == 'main'
        run: pnpm exec tsc --noEmit

      - name: Build (production, next + custom server tsc)
        run: pnpm build
