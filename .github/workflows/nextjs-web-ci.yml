# Workspace CI — lint, test & build on every PR.
#
#   PR → dev  : Biome lint + Vitest unit tests + production build (baseline gate)
#   PR → main : strict — frozen-lockfile install, Biome with warnings-as-errors,
#               tsc --noEmit, Vitest, production build (promotion gate; main
#               auto-deploys via the Coolify webhook on merge)
#
# pnpm workspace（ルート lockfile）。install は必ずリポジトリルートで実行する。
# E2E (Playwright) not set up yet — add a job here when it lands
# (see _specs/techstack.md).

name: nextjs-web CI

on:
  pull_request:
    branches: [dev, main]

concurrency:
  group: nextjs-web-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # マージ済みマイグレーションの改変を止める。
  # マイグレーションは merge した瞬間に自動で当たる（db-migrate-dev/-main）ので、
  # base に載っているものは既に本物の DB に適用済み = 取り消せない。
  # あとから書き換えると次のデプロイが P3006 で落ち、しかも落ちるのは
  # 直した本人ではなく「次に merge した誰か」になる。
  migrations:
    name: shared-db — 適用済みマイグレーションの保護
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          # base との差分を見るので履歴が要る
          fetch-depth: 0
      - name: Check applied migrations are untouched
        run: bash shared-db/scripts/check-applied-migrations.sh "origin/${{ github.event.pull_request.base.ref }}"

  authz-core:
    name: authz-core — lint & test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: packages/authz-core
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install (frozen lockfile, workspace root)
        run: pnpm install --frozen-lockfile
        working-directory: .
      - name: Lint (Biome)
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests (Vitest)
        run: pnpm test

  web:
    name: nextjs-web — lint & build (base ${{ github.base_ref }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: coolify/apps/nextjs-web
    steps:
      # fetch-depth: 0 — マイグレーション後方互換ガードが base との差分を
      # 取るため。浅いクローンだと origin/<base> が無く、diff が空になって
      # **ガードが黙って通ってしまう**（守っているつもりで守れていない状態）。
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Reads the pinned pnpm version from the root "packageManager" field.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install (frozen lockfile, workspace root)
        run: pnpm install --frozen-lockfile
        working-directory: .

      - name: Sync Prisma schema (shared-db) + generate client
        run: pnpm db:sync-schema && pnpm db:generate

      - name: Lint (Biome)
        run: pnpm lint

      - name: Unit tests (Vitest)
        run: pnpm test

      - name: Page gate guard (requireAppRead)
        run: bash scripts/check-page-gates.sh

      - name: Server Action gate guard (checkPermission / requireAnyRead)
        run: node scripts/check-server-action-gates.mjs

      # 監査 C1: 認証の門（next の proxy / next-auth の authorized）に公開済みの
      # advisory が出たまま 2 版滞留していた。本番依存の high 以上で止める。
      # dev 専用の CLI（prisma の mysql2 / deepmerge-ts）は --prod で外れる。
      - name: Dependency audit (prod, high+)
        working-directory: .
        run: pnpm audit --prod --audit-level=high

      # 英語・中国語対応は段階的に進める（数千箇所が未着手のまま残る）。
      # 全部訳し終わっていなくても落とさない — 見るのは **後戻り** だけで、
      # baseline より増えたときに失敗する。使い方は tools/i18n/README.md。
      - name: i18n regression guard (no new Japanese literals)
        run: node ../../../tools/i18n/i18n-scan.mjs

      # 用語集そのものの検査。同じ ja に違う訳が当たっていないか
      # （_specs/i18n-glossary.md が i18n 用語の正 — §2.11 の手順）。
      - name: i18n glossary consistency
        run: node ../../../tools/i18n/i18n-glossary-check.mjs

      # tr() の鍵は本物の next-intl 鍵（messages/ja.json のパス）。
      # 鍵が 5,700 件を超えると next-intl の型付け（AppConfig["Messages"]）が
      # TypeScript の複雑さの上限に触れるため型検査を諦めており（src/global.d.ts）、
      # 実在しない鍵で呼んでいないかはここでしか見られない。
      - name: i18n translation keys exist
        run: node ../../../tools/i18n-unify/verify-keys.mjs

      - name: i18n dynamic key prefixes exist (tr(`ns.${x}`))
        run: node scripts/check-dynamic-i18n-keys.mjs

      # "use server" は async 関数しか export できない。定数を export すると
      # クライアントにはアクション参照が渡り、実行時に画面ごと落ちる
      # （tsc も biome も next build も検出しない）。
      - name: Server Action export guard ("use server")
        run: bash scripts/check-use-server-exports.sh

      # マイグレーションは「前のバージョンのアプリでも動く」形であること。
      # デプロイと migrator は同じ merge から並行に走り、どちらが先に着くか
      # 決められない。列を落とす・改名する類は、まだ serving 中の旧コンテナを
      # 壊す。禁止はしないが、migration.sql に
      #   -- allow-destructive: <理由>
      # と書いて意図的だと言わせる。
      - name: Migration backward-compat guard
        run: bash scripts/check-migration-compat.sh "origin/${{ github.base_ref }}"

      # ── strict gates: promotion PRs into main only ──────────────────────
      - name: Lint strict — warnings as errors (main)
        if: github.base_ref == 'main'
        run: pnpm exec biome check --error-on-warnings

      # fumadocs-mdx の生成物 .source/ が無いと tsc が落ちるため、
      # package.json の typecheck スクリプト（fumadocs-mdx && tsc --noEmit）を使う
      - name: Typecheck (main)
        if: github.base_ref == 'main'
        run: pnpm typecheck

      - name: Build (production)
        run: pnpm build

  kiosk:
    name: nextjs-kiosk — lint & build (base ${{ github.base_ref }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: coolify/apps/nextjs-kiosk
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install (frozen lockfile, workspace root)
        run: pnpm install --frozen-lockfile
        working-directory: .

      - name: Sync Prisma schema (shared-db) + generate client
        run: pnpm db:sync-schema && pnpm db:generate

      - name: Lint (Biome)
        run: pnpm lint

      # twin ファイルのドリフト検知を含む
      - name: Unit tests (Vitest)
        run: pnpm test

      - name: Lint strict — warnings as errors (main)
        if: github.base_ref == 'main'
        run: pnpm exec biome check --error-on-warnings

      - name: Typecheck (main)
        if: github.base_ref == 'main'
        run: pnpm exec tsc --noEmit

      - name: Build (production, next + custom server tsc)
        run: pnpm build
