<svg viewBox="0 0 860 840" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto;background:#ffffff;display:block" id="swimlane-svg"><defs><marker id="arrowhead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#334155" /></marker><pattern id="gridp" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M 24 0 L 0 0 0 24" fill="none" stroke="#e5e7eb" stroke-width="0.5" /></pattern></defs><rect x="40" y="84" width="780" height="732" fill="url(#gridp)" opacity="0.5" /><rect x="40" y="84" width="300" height="72" fill="white" opacity="0.9" /><text x="52" y="114" fill="#0f172a" font-family="'Noto Sans JP',sans-serif" font-size="13" font-weight="700">Step</text><text x="52" y="134" fill="#0f172a" opacity="0.7" font-family="'Noto Sans JP',sans-serif" font-size="11">Description</text><line x1="40" x2="340" y1="156" y2="156" stroke="#334155" stroke-width="1.2" vector-effect="non-scaling-stroke" /><rect x="40" y="84" width="300" height="732" fill="none" stroke="#334155" stroke-width="1.2" vector-effect="non-scaling-stroke" /><g><text x="52" y="226" fill="#0f172a" font-family="'Noto Sans JP',sans-serif" font-size="12" font-weight="600">1. Billing closing</text><text x="52" y="246" fill="#0f172a" opacity="0.78" font-family="'Noto Sans JP',sans-serif" font-size="10" font-weight="400"><tspan x="52" dy="0"><tspan font-weight="400" font-style="normal" text-decoration="none">Run on each customer's set closing date. The closing date </tspan></tspan><tspan x="52" dy="14"><tspan font-weight="400" font-style="normal" text-decoration="none">and payment terms follow the customer master.</tspan></tspan></text></g><g><text x="52" y="306" fill="#0f172a" font-family="'Noto Sans JP',sans-serif" font-size="12" font-weight="600">2. Aggregation</text><text x="52" y="326" fill="#0f172a" opacity="0.78" font-family="'Noto Sans JP',sans-serif" font-size="10" font-weight="400"><tspan x="52" dy="0"><tspan font-weight="400" font-style="normal" text-decoration="none">Deliveries made within that period are aggregated automati</tspan></tspan><tspan x="52" dy="14"><tspan font-weight="400" font-style="normal" text-decoration="none">cally. Stock-storage shipments are not included.</tspan></tspan></text></g><g><text x="52" y="386" fill="#0f172a" font-family="'Noto Sans JP',sans-serif" font-size="12" font-weight="600">3. Invoice generation</text><text x="52" y="406" fill="#0f172a" opacity="0.78" font-family="'Noto Sans JP',sans-serif" font-size="10" font-weight="400"><tspan x="52" dy="0"><tspan font-weight="400" font-style="normal" text-decoration="none">Generate an invoice from the closed content, and check the</tspan></tspan><tspan x="52" dy="14"><tspan font-weight="400" font-style="normal" text-decoration="none"> line items and amounts (subtotal, tax, total).</tspan></tspan></text></g><g><text x="52" y="486" fill="#0f172a" font-family="'Noto Sans JP',sans-serif" font-size="12" font-weight="600">4. Issue</text><text x="52" y="506" fill="#0f172a" opacity="0.78" font-family="'Noto Sans JP',sans-serif" font-size="10" font-weight="400"><tspan x="52" dy="0"><tspan font-weight="400" font-style="normal" text-decoration="none">Once issued, a PDF is saved.</tspan></tspan></text></g><g><text x="52" y="566" fill="#0f172a" font-family="'Noto Sans JP',sans-serif" font-size="12" font-weight="600">5. Send</text><text x="52" y="586" fill="#0f172a" opacity="0.78" font-family="'Noto Sans JP',sans-serif" font-size="10" font-weight="400"><tspan x="52" dy="0"><tspan font-weight="400" font-style="normal" text-decoration="none">Once sent to the customer, mark it "Sent".</tspan></tspan></text></g><g><text x="52" y="646" fill="#0f172a" font-family="'Noto Sans JP',sans-serif" font-size="12" font-weight="600">6. Payment confirmation</text><text x="52" y="666" fill="#0f172a" opacity="0.78" font-family="'Noto Sans JP',sans-serif" font-size="10" font-weight="400"><tspan x="52" dy="0"><tspan font-weight="400" font-style="normal" text-decoration="none">Confirm the actual payment before marking it "Paid".</tspan></tspan></text></g><g><text x="52" y="726" fill="#0f172a" font-family="'Noto Sans JP',sans-serif" font-size="12" font-weight="600">7. Accounting export</text><text x="52" y="746" fill="#0f172a" opacity="0.78" font-family="'Noto Sans JP',sans-serif" font-size="10" font-weight="400"><tspan x="52" dy="0"><tspan font-weight="400" font-style="normal" text-decoration="none">Export the closed items as CSV for Yayoi Kaikei. The expor</tspan></tspan><tspan x="52" dy="14"><tspan font-weight="400" font-style="normal" text-decoration="none">ted billing closing becomes "Exported".</tspan></tspan></text></g><g><rect x="340" y="84" width="252" height="732" fill="#fce7f3" opacity="0.12" /><rect x="340" y="84" width="252" height="72" fill="#fce7f3" opacity="0.9" /><text x="466" y="126" text-anchor="middle" fill="#9d174d" font-family="'Noto Sans JP',sans-serif" font-size="15" font-weight="700" letter-spacing="0.06em">Accounting</text><line x1="340" x2="592" y1="156" y2="156" stroke="#334155" stroke-width="1.2" vector-effect="non-scaling-stroke" /></g><g><rect x="592" y="84" width="228" height="732" fill="#eef2ff" opacity="0.12" /><rect x="592" y="84" width="228" height="72" fill="#eef2ff" opacity="0.9" /><g><circle cx="620" cy="120" r="16" fill="#ffffff" stroke="#3730a3" stroke-width="1.2" /><svg x="609" y="109" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#3730a3" stroke-width="2"><ellipse cx="12" cy="5" rx="9" ry="3" /><path d="M3 5V19A9 3 0 0 0 21 19V5" /><path d="M3 12A9 3 0 0 0 21 12" /></svg></g><text x="646" y="126" text-anchor="start" fill="#3730a3" font-family="'Noto Sans JP',sans-serif" font-size="15" font-weight="700" letter-spacing="0.06em">System</text><line x1="592" x2="820" y1="156" y2="156" stroke="#334155" stroke-width="1.2" vector-effect="non-scaling-stroke" /></g><line x1="40" y1="276" x2="820" y2="276" stroke="#e5e7eb" stroke-widt