<svg x="380" y="488" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1e40af" stroke-width="2"><path d="M4 14a1 1 0 0 1-.78-1.63l9.9-10.2a.5.5 0 0 1 .86.46l-1.92 6.02A1 1 0 0 0 13 10h7a1 1 0 0 1 .78 1.63l-9.9 10.2a.5.5 0 0 1-.86-.46l1.92-6.02A1 1 0 0 0 11 14z" /></svg><text x="474" y="501" text-anchor="middle" fill="#1e40af" font-family="'Noto Sans JP',sans-serif" font-size="13" font-weight="500">Issue the invoice</text></g><g><rect x="372" y="554" width="188" height="44" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.3" /><svg x="380" y="568" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#075985" stroke-width="2"><path d="M14.536 21.686a.5.5 0 0 0 .937-.024l6.5-19a.496.496 0 0 0-.635-.635l-19 6.5a.5.5 0 0 0-.024.937l7.93 3.18a2 2 0 0 1 1.112 1.11z" /><path d="m21.854 2.147-10.94 10.939" /></svg><text x="474" y="581" text-anchor="middle" fill="#075985" font-family="'Noto Sans JP',sans-serif" font-size="13" font-weight="500">Mark as sent</text></g><g><rect x="372" y="634" width="188" height="44" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.3" /><svg x="380" y="648" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#166534" stroke-width="2"><circle cx="12" cy="12" r="10" /><path d="m9 12 2 2 4-4" /></svg><text x="474" y="661" text-anchor="middle" fill="#166534" font-family="'Noto Sans JP',sans-serif" font-size="13" font-weight="500">Mark as paid</text></g><g><rect x="372" y="714" width="188" height="44" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.3" /><svg x="380" y="728" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1e40af" stroke-width="2"><path d="M4 14a1 1 0 0 1-.78-1.63l9.9-10.2a.5.5 0 0 1 .86.46l-1.92 6.02A1 1 0 0 0 13 10h7a1 1 0 0 1 .78 1.63l-9.9 10.2a.5.5 0 0 1-.86-.46l1.92-6.02A1 1 0 0 0 11 14z" /></svg><text x="474" y="741" text-anchor="middle" fill="#1e40af" font-family="'Noto Sans JP',sans-serif" font-size="13" font-weight="500">Export to accounting</text></g><text x="430"