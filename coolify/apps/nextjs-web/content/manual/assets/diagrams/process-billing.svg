<svg viewBox="0 0 816 840" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto;background:#ffffff;display:block" id="swimlane-svg"><defs><marker id="arrowhead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#334155" /></marker><pattern id="gridp" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M 24 0 L 0 0 0 24" fill="none" stroke="#e5e7eb" stroke-width="0.5" /></pattern></defs><rect x="40" y="84" width="736" height="732" fill="url(#gridp)" opacity="0.5" /><rect x="40" y="84" width="300" height="72" fill="white" opacity="0.9" /><text x="52" y="114" fill="#0f172a" font-family="'Noto Sans JP',sans-serif" font-size="13" font-weight="700">手順</text><text x="52" y="134" fill="#0f172a" opacity="0.7" font-family="'Noto Sans JP',sans-serif" font-size="11">説明</text><line x1="40" x2="340" y1="156" y2="156" stroke="#334155" stroke-width="1.2" vector-effect="non-scaling-stroke" /><rect x="40" y="84" width="300" height="732" fill="none" stroke="#334155" stroke-width="1.2" vector-effect="non-scaling-stroke" /><g><text x="52" y="226" fill="#0f172a" font-family="'Noto Sans JP',sans-serif" font-size="12" font-weight="600">1. 締日処理</text><text x="52" y="246" fill="#0f172a" opacity="0.78" font-family="'Noto Sans JP',sans-serif" font-size="10" font-weight="400"><tspan x="52" dy="0"><tspan font-weight="400" font-style="normal" text-decoration="none">顧客ごとに決めた締日で実行する。締日・支払サイトは顧客</tspan></tspan><tspan x="52" dy="14"><tspan font-weight="400" font-style="normal" text-decoration="none">マスタの設定に従う。</tspan></tspan></text></g><g><text x="52" y="306" fill="#0f172a" font-family="'Noto Sans JP',sans-serif" font-size="12" font-weight="600">2. 集計</text><text x="52" y="326" fill="#0f172a" opacity="0.78" font-family="'Noto Sans JP',sans-serif" font-size="10" font-weight="400"><tspan x="52" dy="0"><tspan font-weight="400" font-style="normal" text-decoration="none">その期間に納品した分が自動で集計される。在庫保管の出荷</tspan></tspan><tspan x="52" dy="14"><tspan font-weight="400" font-style="normal" text-decoration="none">は対象にならない。</tspan></tspan></text></g><g><text x="52" y="386" fill="#0f172a" font-family="'Noto Sans JP',sans-serif" font-size="12" font-weight="600">3. 請求書生成</text><text x="52" y="406" fill="#0f172a" opacity="0.78" font-family="'Noto Sans JP',sans-serif" font-size="10" font-weight="400"><tspan x="52" dy="0"><tspan font-weight="400" font-style="normal" text-decoration="none">締めた内容から請求書を生成し、明細と金額（小計・消費税</tspan></tspan><tspan x="52" dy="14"><tspan font-weight="400" font-style="normal" text-decoration="none">・合計）を確認する。</tspan></tspan></text></g><g><text x="52" y="486" fill="#0f172a" font-family="'Noto Sans JP',sans-serif" font-size="12" font-weight="600">4. 発行</text><text x="52" y="506" fill="#0f172a" opacity="0.78" font-family="'Noto Sans JP',sans-serif" font-size="10" font-weight="400"><tspan x="52" dy="0"><tspan font-weight="400" font-style="normal" text-decoration="none">発行すると PDF が保存される。</tspan></tspan></text></g><g><text x="52" y="566" fill="#0f172a" font-family="'Noto Sans JP',sans-serif" font-size="12" font-weight="600">5. 送付</text><text x="52" y="586" fill="#0f172a" opacity="0.78" font-family="'Noto Sans JP',sans-serif" font-size="10" font-weight="400"><tspan x="52" dy="0"><tspan font-weight="400" font-style="normal" text-decoration="none">顧客へ送付したら「送付済」にする。</tspan></tspan></text></g><g><text x="52" y="646" fill="#0f172a" font-family="'Noto Sans JP',sans-serif" font-size="12" font-weight="600">6. 入金確認</text><text x="52" y="666" fill="#0f172a" opacity="0.78" font-family="'Noto Sans JP',sans-serif" font-size="10" font-weight="400"><tspan x="52" dy="0"><tspan font-weight="400" font-style="normal" text-decoration="none">実際の入金を確認してから「支払済」にする。</tspan></tspan></text></g><g><text x="52" y="726" fill="#0f172a" font-family="'Noto Sans JP',sans-serif" font-size="12" font-weight="600">7. 会計連携</text><text x="52" y="746" fill="#0f172a" opacity="0.78" font-family="'Noto Sans JP',sans-serif" font-size="10" font-weight="400"><tspan x="52" dy="0"><tspan font-weight="400" font-style="normal" text-decoration="none">締めた分を弥生会計向けの CSV として書き出す。書き出し</tspan></tspan><tspan x="52" dy="14"><tspan font-weight="400" font-style="normal" text-decoration="none">た締日処理は「エクスポート済」になる。</tspan></tspan></text></g><g><rect x="340" y="84" width="218" height="732" fill="#fce7f3" opacity="0.12" /><rect x="340" y="84" width="218" height="72" fill="#fce7f3" opacity="0.9" /><text x="449" y="126" text-anchor="middle" fill="#9d174d" font-family="'Noto Sans JP',sans-serif" font-size="15" font-weight="700" letter-spacing="0.06em">経理</text><line x1="340" x2="558" y1="156" y2="156" stroke="#334155" stroke-width="1.2" vector-effect="non-scaling-stroke" /></g><g><rect x="558" y="84" width="218" height="732" fill="#eef2ff" opacity="0.12" /><rect x="558" y="84" width="218" height="72" fill="#eef2ff" opacity="0.9" /><g><circle cx="586" cy="120" r="16" fill="#ffffff" stroke="#3730a3" stroke-width="1.2" /><svg x="575" y="109" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#3730a3" stroke-width="2"><ellipse cx="12" cy="5" rx="9" ry="3" /><path d="M3 5V19A9 3 0 0 0 21 19V5" /><path d="M3 12A9 3 0 0 0 21 12" /></svg></g><text x="612" y="126" text-anchor="start" fill="#3730a3" font-family="'Noto Sans JP',sans-serif" font-size="15" font-weight="700" letter-spacing="0.06em">システム</text><line x1="558" x2="776" y1="156" y2="156" stroke="#334155" stroke-width="1.2" vector-effect="non-scaling-stroke" /></g><line x1="40" y1="276" x2="776" y2="276" stroke="#e5e7eb" stroke-width="1" vector-effect="non-scaling-stroke" opacity="0.95" /><line x1="40" y1="356" x2="776" y2="356" stroke="#e5e7eb" stroke-width="1" vector-effect="non-scaling-stroke" opacity="0.95" /><line x1="40" y1="456" x2="776" y2="456" stroke="#e5e7eb" stroke-width="1" vector-effect="non-scaling-stroke" opacity="0.95" /><line x1="40" y1="536" x2="776" y2="536" stroke="#e5e7eb" stroke-width="1" vector-effect="non-scaling-stroke" opacity="0.95" /><line x1="40" y1="616" x2="776" y2="616" stroke="#e5e7eb" stroke-width="1" vector-effect="non-scaling-stroke" opacity="0.95" /><line x1="40" y1="696" x2="776" y2="696" stroke="#e5e7eb" stroke-width="1" vector-effect="non-scaling-stroke" opacity="0.95" /><rect x="340" y="84" width="436" height="732" fill="none" stroke="#334155" stroke-width="1.2" vector-effect="non-scaling-stroke" /><line x1="558" x2="558" y1="84" y2="816" stroke="#334155" stroke-width="1.2" vector-effect="non-scaling-stroke" /><path d="M 449 258 L 449 276 L 667 276 L 667 294" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#arrowhead)" /><path d="M 667 338 L 667 356 L 449 356 L 449 374" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#arrowhead)" /><line x1="449" y1="418" x2="449" y2="474" stroke="#334155" stroke-width="1.6" marker-end="url(#arrowhead)" /><line x1="449" y1="518" x2="449" y2="554" stroke="#334155" stroke-width="1.6" marker-end="url(#arrowhead)" /><line x1="449" y1="598" x2="449" y2="634" stroke="#334155" stroke-width="1.6" marker-end="url(#arrowhead)" /><line x1="449" y1="678" x2="449" y2="714" stroke="#334155" stroke-width="1.6" marker-end="url(#arrowhead)" /><line x1="449" y1="191" x2="449" y2="214" stroke="#334155" stroke-width="1.6" marker-end="url(#arrowhead)" /><circle cx="449" cy="186" r="5" fill="#334155" /><line x1="449" y1="758" x2="449" y2="781" stroke="#334155" stroke-width="1.6" marker-end="url(#arrowhead)" /><circle cx="449" cy="786" r="5" fill="#334155" /><g><rect x="355" y="214" width="188" height="44" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.3" /><svg x="363" y="228" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1e40af" stroke-width="2"><path d="M4 14a1 1 0 0 1-.78-1.63l9.9-10.2a.5.5 0 0 1 .86.46l-1.92 6.02A1 1 0 0 0 13 10h7a1 1 0 0 1 .78 1.63l-9.9 10.2a.5.5 0 0 1-.86-.46l1.92-6.02A1 1 0 0 0 11 14z" /></svg><text x="457" y="241" text-anchor="middle" fill="#1e40af" font-family="'Noto Sans JP',sans-serif" font-size="13" font-weight="500">締日処理を実行する</text></g><g><rect x="573" y="294" width="188" height="44" fill="#e0e7ff" stroke="#4f46e5" stroke-width="1.3" /><svg x="581" y="308" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#3730a3" stroke-width="2"><ellipse cx="12" cy="5" rx="9" ry="3" /><path d="M3 5V19A9 3 0 0 0 21 19V5" /><path d="M3 12A9 3 0 0 0 21 12" /></svg><text x="675" y="321" text-anchor="middle" fill="#3730a3" font-family="'Noto Sans JP',sans-serif" font-size="13" font-weight="500">納品分を集計する</text></g><g><rect x="355" y="374" width="188" height="44" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.3" /><svg x="363" y="388" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1e40af" stroke-width="2"><path d="M4 14a1 1 0 0 1-.78-1.63l9.9-10.2a.5.5 0 0 1 .86.46l-1.92 6.02A1 1 0 0 0 13 10h7a1 1 0 0 1 .78 1.63l-9.9 10.2a.5.5 0 0 1-.86-.46l1.92-6.02A1 1 0 0 0 11 14z" /></svg><text x="457" y="401" text-anchor="middle" fill="#1e40af" font-family="'Noto Sans JP',sans-serif" font-size="13" font-weight="500">請求書を生成する</text><g><title>請求書</title><path d="M 483 410 H 540 L 548 418 V 450 H 483 Z" fill="#fdf2f8" stroke="#db2777" stroke-width="1.1" /><path d="M 540 410 V 418 H 548" fill="none" stroke="#db2777" stroke-width="1" /><text x="513.5" y="422" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="9" fill="#9d174d">請求書</text></g></g><g><rect x="355" y="474" width="188" height="44" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.3" /><svg x="363" y="488" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1e40af" stroke-width="2"><path d="M4 14a1 1 0 0 1-.78-1.63l9.9-10.2a.5.5 0 0 1 .86.46l-1.92 6.02A1 1 0 0 0 13 10h7a1 1 0 0 1 .78 1.63l-9.9 10.2a.5.5 0 0 1-.86-.46l1.92-6.02A1 1 0 0 0 11 14z" /></svg><text x="457" y="501" text-anchor="middle" fill="#1e40af" font-family="'Noto Sans JP',sans-serif" font-size="13" font-weight="500">請求書を発行する</text></g><g><rect x="355" y="554" width="188" height="44" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.3" /><svg x="363" y="568" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#075985" stroke-width="2"><path d="M14.536 21.686a.5.5 0 0 0 .937-.024l6.5-19a.496.496 0 0 0-.635-.635l-19 6.5a.5.5 0 0 0-.024.937l7.93 3.18a2 2 0 0 1 1.112 1.11z" /><path d="m21.854 2.147-10.94 10.939" /></svg><text x="457" y="581" text-anchor="middle" fill="#075985" font-family="'Noto Sans JP',sans-serif" font-size="13" font-weight="500">送付済にする</text></g><g><rect x="355" y="634" width="188" height="44" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.3" /><svg x="363" y="648" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#166534" stroke-width="2"><circle cx="12" cy="12" r="10" /><path d="m9 12 2 2 4-4" /></svg><text x="457" y="661" text-anchor="middle" fill="#166534" font-family="'Noto Sans JP',sans-serif" font-size="13" font-weight="500">支払済にする</text></g><g><rect x="355" y="714" width="188" height="44" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.3" /><svg x="363" y="728" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1e40af" stroke-width="2"><path d="M4 14a1 1 0 0 1-.78-1.63l9.9-10.2a.5.5 0 0 1 .86.46l-1.92 6.02A1 1 0 0 0 13 10h7a1 1 0 0 1 .78 1.63l-9.9 10.2a.5.5 0 0 1-.86-.46l1.92-6.02A1 1 0 0 0 11 14z" /></svg><text x="457" y="741" text-anchor="middle" fill="#1e40af" font-family="'Noto Sans JP',sans-serif" font-size="13" font-weight="500">会計へ書き出す</text></g><text x="408" y="48" text-anchor="middle" fill="#0f172a" font-family="'Noto Sans JP','Noto Sans',sans-serif" font-size="24" font-weight="600" letter-spacing="0.05em">請求の流れ — 締日処理から入金まで</text></svg>
