<svg viewBox="0 0 938 1016" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto;background:#ffffff;display:block" id="swimlane-svg"><defs><marker id="arrowhead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#334155" /></marker><pattern id="gridp" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M 24 0 L 0 0 0 24" fill="none" stroke="#e5e7eb" stroke-width="0.5" /></pattern></defs><rect x="40" y="84" width="858" height="908" fill="url(#gridp)" opacity="0.5" /><rect x="40" y="84" width="300" height="72" fill="white" opacity="0.9" /><text x="52" y="114" fill="#0f172a" font-family="'Noto Sans JP',sans-serif" font-size="13" font-weight="700">Step</text><text x="52" y="134" fill="#0f172a" opacity="0.7" font-family="'Noto Sans JP',sans-serif" font-size="11">Description</text><line x1="40" x2="340" y1="156" y2="156" stroke="#334155" stroke-width="1.2" vector-effect="non-scaling-stroke" /><rect x="40" y="84" width="300" height="908" fill="none" stroke="#334155" stroke-width="1.2" vector-effect="non-scaling-stroke" /><g><text x="52" y="226" fill="#0f172a" font-family="'Noto Sans JP',sans-serif" font-size="12" font-weight="600">1. Delivery order</text><text x="52" y="246" fill="#0f172a" opacity="0.78" font-family="'Noto Sans JP',sans-serif" font-size="10" font-weight="400"><tspan x="52" dy="0"><tspan font-weight="400" font-style="normal" text-decoration="none">Selecting an order acceptance fills in the order lines that c</tspan></tspan><tspan x="52" dy="14"><tspan font-weight="400" font-style="normal" text-decoration="none">an be shipped. Decide the lot, quantity, and shipping site.</tspan></tspan></text></g><g><text x="52" y="326" fill="#0f172a" font-family="'Noto Sans JP',sans-serif" font-size="12" font-weight="600">2. Confirm</text><text x="52" y="346" fill="#0f172a" opacity="0.78" font-family="'Noto Sans JP',sans-serif" font-size="10" font-weight="400"><tspan x="52" dy="0"><tspan font-weight="400" font-style="normal" text-decoration="none">Confirm the content so it is ready to ship.</tspan></tspan></text></g><g><text x="52" y="406" fill="#0f172a" font-family="'Noto Sans JP',sans-serif" font-size="12" font-weight="600">3. Shipment</text><text x="52" y="426" fill="#0f172a" opacity="0.78" font-family="'Noto Sans JP',sans-serif" font-size="10" font-weight="400"><tspan x="52" dy="0"><tspan font-weight="400" font-style="normal" text-decoration="none">Once actually sent out, mark it "Shipped".</tspan></tspan></text></g><g><text x="52" y="486" fill="#0f172a" font-family="'Noto Sans JP',sans-serif" font-size="12" font-weight="600">4. Stock update</text><text x="52" y="506" fill="#0f172a" opacity="0.78" font-family="'Noto Sans JP',sans-serif" font-size="10" font-weight="400"><tspan x="52" dy="0"><tspan font-weight="400" font-style="normal" text-decoration="none">The shipping site's stock decreases, and the order line's s</tspan></tspan><tspan x="52" dy="14"><tspan font-weight="400" font-style="normal" text-decoration="none">tatus changes to "Partially shipped" or "Shipped".</tspan></tspan></text></g><g><text x="52" y="656" fill="#0f172a" font-family="'Noto Sans JP',sans-serif" font-size="12" font-weight="600">5. Delivery note</text><text x="52" y="676" fill="#0f172a" opacity="0.78" font-family="'Noto Sans JP',sans-serif" font-size="10" font-weight="400"><tspan x="52" dy="0"><tspan font-weight="400" font-style="normal" text-decoration="none">An issued delivery note is created at the same time as conf</tspan></tspan><tspan x="52" dy="14"><tspan font-weight="400" font-style="normal" text-decoration="none">irmation. Delivery method (standard / direct to end user) an</tspan></tspan><tspan x="52" dy="14"><tspan font-weight="400" font-style="normal" text-decoration="none">d whether to show the price are inherited from the order acc</tspan></tspan><tspan x="52" dy="14"><tspan font-weight="400" font-style="normal" text-decoration="none">eptance.</tspan></tspan></text></g><g><text x="52" y="762" fill="#0f172a" font-family="'Noto Sans JP',sans-serif" font-size="12" font-weight="600">6. Delivery</text><text x="52" y="782" fill="#0f172a" opacity="0.78" font-family="'Noto Sans JP',sans-serif" font-size="10" font-weight="400"><tspan x="52" dy="0"><tspan font-weight="400" font-style="normal" text-decoration="none">Once it arrives, mark it "Delivered". A shipment that reache</tspan></tspan><tspan x="52" dy="14"><tspan font-weight="400" font-style="normal" text-decoration="none">s this point becomes eligible for billing.</tspan></tspan></text></g><g><text x="52" y="842" fill="#0f172a" font-family="'Noto Sans JP',sans-serif" font-size="12" font-weight="600">7. Stock storage</text><text x="52" y="862" fill="#0f172a" opacity="0.78" font-family="'Noto Sans JP',sans-serif" font-size="10" font-weight="400"><tspan x="52" dy="0"><tspan font-weight="400" font-style="normal" text-decoration="none">A type used to keep spare production in-house. It does not </tspan></tspan><tspan x="52" dy="14"><tspan font-weight="400" font-style="normal" text-decoration="none">proceed to billing.</tspan></tspan></text></g><g><rect x="340" y="84" width="322" height="908" fill="#ffedd5" opacity="0.12" /><rect x="340" y="84" width="322" height="72" fill="#ffedd5" opacity="0.9" /><text x="501" y="126" text-anchor="middle" fill="#9a3412" font-family="'Noto Sans JP',sans-serif" font-size="15" font-weight="700" letter-spacing="0.06em">Shipping</text><line x1="340" x2="662" y1="156" y2="156" stroke="#334155" stroke-width="1.2" vector-effect="non-scaling-stroke" /></g><g><rect x="662" y="84" width="236" height="908" fill="#eef2ff" opacity="0.12" /><rect x="662" y="84" width="236" height="72" fill="#eef2ff" opacity="0.9" /><g><circle cx="690" cy="120" r="16" fill="#ffffff" stroke="#3730a3" stroke-width="1.2" /><svg x="679" y="109" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#3730a3" stroke-width="2"><ellipse cx="12" cy="5" rx=