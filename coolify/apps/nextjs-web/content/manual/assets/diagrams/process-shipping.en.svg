" font-family="'Noto Sans JP',sans-serif" font-size="13" font-weight="500">Issue a delivery n…</text><g><title>Delivery note</title><path d="M 814 680 H 871 L 879 688 V 720 H 814 Z" fill="#fff7ed" stroke="#ea580c" stroke-width="1.1" /><path d="M 871 680 V 688 H 879" fill="none" stroke="#ea580c" stroke-width="1" /><text x="844.5" y="692" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="9" fill="#9a3412">Delivery…</text></g></g><g><rect x="355" y="750" width="188" height="44" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.3" /><svg x="363" y="764" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1e40af" stroke-width="2"><path d="M4 14a1 1 0 0 1-.78-1.63l9.9-10.2a.5.5 0 0 1 .86.46l-1.92 6.02A1 1 0 0 0 13 10h7a1 1 0 0 1 .78 1.63l-9.9 10.2a.5.5 0 0 1-.86-.46l1.92-6.02A1 1 0 0 0 11 14z" /></svg><text x="457" y="777" text-anchor="middle" fill="#1e40af" font-family="'Noto Sans JP',sans-serif" font-size="13" font-weight="500">Mark as delivered</text></g><g><polygon points="473,830 633,830 647,852 633,874 473,874 459,852" fill="#f4f4f5" stroke="#71717a" stroke-width="1.3" /><svg x="473" y="844" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#52525b" stroke-width="2"><circle cx="12" cy="12" r="10" /><path d="M12 6v6l4 2" /></svg><text x="561" y="857" text-anchor="middle" fill="#52525b" font-family="'Noto Sans JP',sans-serif" font-size="13" font-weight="500">Store in-house</text></g><g><rect x="737.5" y="608" width="85" height="20" rx="3" fill="#ffedd5" fill-opacity="0.8" stroke="#c2410c" stroke-width="0.9" /><text x="780" y="623" text-anchor="middle" font-size="11" font-weight="600" font-family="'Noto Sans JP',sans-serif" fill="#c2410c">Dispatch</text></g><g><path d="M 780 518 L 780 541" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#arrowhead)" /></g><text x="469" y="48" text-anchor="middle" fill="#0f172a" font-family="'Noto Sans JP','Noto Sans',sans-serif" font-size="24" font-weight="600" letter