<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>フォーム回答</title>
  <link rel="stylesheet" href="base.css" />
  <style>
    /* 項目は利用者が組むので、この帳票だけは**列が固定できない**。
       他の帳票のような明細表ではなく「項目名 / 回答」の 2 列で縦に積み、
       長い本文（複数行・リッチテキスト・サブテーブル）だけは 2 列をやめて
       紙の幅をまるごと使う（tr.block）。72% 幅のセルに長文を押し込むと
       行数だけが増えて読めない。 */
    .answer-table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
      margin-bottom: 16pt;
    }
    .answer-table th,
    .answer-table td {
      border: 0.75pt solid #ddd;
      padding: 6pt 8pt;
      vertical-align: top;
      font-size: 10pt;
      line-height: 1.6;
      word-break: break-word;
    }
    .answer-table th {
      width: 28%;
      background: #f7f7f7;
      text-align: left;
      font-weight: 600;
    }
    /* 短い行は途中で改ページさせない。長い本文（.block）は 1 ページに
       収まらないことがあるので、こちらは切れてよい — avoid を付けると
       ページ末で丸ごと押し出され、最悪あふれた分が消える。 */
    .answer-table tr:not(.block) {
      page-break-inside: avoid;
    }
    .empty {
      color: #999;
    }
    .num {
      font-variant-numeric: tabular-nums;
    }

    /* 選んだ選択肢。「A, B」だと選択肢自体に読点があったときに数が読めない。 */
    ul.choices {
      list-style: none;
      margin: 0;
      padding: 0;
    }
    ul.choices li {
      padding-left: 12pt;
      text-indent: -12pt;
    }
    ul.choices li::before {
      content: "✓ ";
      color: #444;
    }

    /* ─── 長い本文（ラベルを上、中身を下） ─────────────── */
    tr.block > td {
      border: 0;
      /* 下の余白は、次に来る 2 列の行が「この塊の続き」に見えないため
         （サブテーブルの直後に項目行が来ると、表の 4 行目に読めていた）。 */
      padding: 10pt 0 8pt;
    }
    .block-label {
      font-size: 10pt;
      font-weight: 600;
      margin-bottom: 4pt;
      /* 見出しだけがページ末に残らないように。 */
      page-break-after: avoid;
    }
    /* 未回答（.empty）にも同じ枠を出す。枠が消えると、長文の欄だけ
       「そこに欄があること」自体が紙から消えてしまう。 */
    .body > .empty {
      display: block;
    }
    .body > .pre,
    .body > .rich,
    .body > .empty {
      border: 0.75pt solid #ddd;
      padding: 8pt 10pt;
      /* 高さは中身で決まるが、下限を置いて「長く書いてよい欄」だと判るようにする。 */
      min-height: 40pt;
      font-size: 10pt;
      line-height: 1.7;
    }
    /* 複数行テキストは改行と連続空白をそのまま出す。 */
    .pre {
      white-space: pre-wrap;
      word-break: break-word;
    }

    /* リッチテキスト（rich-text-core.toHtml の出力）。テキストと href は
       あちらでエスケープ済み。ここは組版だけを与える。 */
    .rich p {
      margin: 0 0 6pt;
    }
    .rich p:last-child {
      margin-bottom: 0;
    }
    .rich h3 {
      font-size: 12pt;
      margin: 8pt 0 4pt;
    }
    .rich h4 {
      font-size: 11pt;
      margin: 8pt 0 4pt;
    }
    .rich ul,
    .rich ol {
      margin: 0 0 6pt;
      padding-left: 18pt;
    }
    .rich li {
      margin-bottom: 2pt;
    }
    .rich blockquote {
      margin: 0 0 6pt;
      padding-left: 10pt;
      border-left: 2pt solid #ddd;
      color: #555;
    }
    .rich pre {
      margin: 0 0 6pt;
      padding: 6pt 8pt;
      background: #f7f7f7;
      white-space: pre-wrap;
      word-break: break-word;
      font-size: 9pt;
    }
    .rich code {
      background: #f2f2f2;
      padding: 0 2pt;
      font-size: 9pt;
    }
    .rich hr {
      border: 0;
      border-top: 0.75pt solid #ddd;
      margin: 8pt 0;
    }
    .rich a {
      color: #1a1a1a;
      text-decoration: underline;
    }

    /* サブテーブルは 1 セルに畳まず、本物の表として組む。 */
    .subtable {
      width: 100%;
      border-collapse: collapse;
    }
    .subtable th,
    .subtable td {
      border: 0.75pt solid #ddd;
      padding: 4pt 6pt;
      font-size: 9pt;
      vertical-align: top;
      text-align: left;
      word-break: break-word;
    }
    .subtable th {
      background: #f7f7f7;
      font-weight: 600;
    }
    /* 改ページで列名を繰り返す（2 ページ目が何の表か判るように）。 */
    .subtable thead {
      display: table-header-group;
    }

    /* 承認の記録。申請・報告フォームのときだけ出す。 */
    .trail {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 16pt;
    }
    .trail th,
    .trail td {
      border-bottom: 0.5pt solid #eee;
      padding: 4pt 6pt;
      font-size: 9pt;
      text-align: left;
      vertical-align: top;
    }
    .trail th {
      color: #666;
      font-weight: 600;
      border-bottom-width: 0.75pt;
    }
    .trail tr {
      page-break-inside: avoid;
    }
    .section-label {
      font-size: 10pt;
      font-weight: 600;
      margin: 0 0 6pt;
      page-break-after: avoid;
    }

    /* まとめ印刷では 1 回答 = 1 ページ。最後の 1 枚に空ページを足さない。 */
    .answer-page {
      page-break-after: always;
    }
    .answer-page:last-child {
      page-break-after: auto;
    }
  </style>
</head>
<body>
  {{pages}}
</body>
</html>
