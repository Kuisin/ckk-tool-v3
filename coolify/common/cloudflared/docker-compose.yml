# Cloudflare Tunnel connector — public access via Cloudflare.
#
# Remotely-managed (token) tunnel. Public hostname -> service mappings are
# configured in the Cloudflare Zero Trust dashboard; this connector just needs
# network reachability to each target. No public ports / port-forwarding.
#   app-dev.ckk-tool.co.jp  -> http://web:3000        (nextjs-web dev app via socat
#                                                   relay -> Coolify :3004;
#                                                   app-dev.ckk-tool.co.jp = legacy alias)
#   app.ckk-tool.co.jp      -> http://web-main:3000   (nextjs-web main/production app
#                                                   via relay -> Coolify :3005)
#   deploy.ckk-tool.co.jp        -> http://coolify:8080          (Coolify dashboard;
#   deploy.ckk-tool.co.jp/app/*  -> http://coolify-realtime:6001  realtime websocket.
#                                   Protect with Cloudflare Access — full deploy
#                                   rights. Also enables GitHub push auto-deploy
#                                   webhooks at /webhooks/source/github/events/manual)
#   dock.kai-lab.net     -> http://dockge:5001     (portainer, via kept dockge alias)
#   chat.kai-lab.net     -> http://open-webui:8080 (ai-stack — Open WebUI GUI)
#   monitor.kai-lab.net  -> http://grafana:3000    (monitoring stack — Grafana)
#   bi.ckk-tool.co.jp    -> http://metabase:3000   (metabase stack — BI)
#   db.ckk-tool.co.jp    -> http://prisma-studio:5555 (prisma-studio — DB browser)
#   admin.ckk-tool.co.jp     -> http://admin:8000      (admintools PROD — Coolify main
#                                                        branch :8091, via nextjs-web relay;
#                                                        protect with Cloudflare Access!)
#   admin-dev.ckk-tool.co.jp -> http://admin-dev:8000  (admintools DEV — Coolify dev
#                                                        branch :8090, via nextjs-web relay;
#                                                        protect with Cloudflare Access!)
# Ollama (:11434) is NOT published — Open WebUI reaches it internally over ai-stack.
#
# Deployed on docker-mac-pro at ~/stacks/cloudflared (Dockge-managed).
# Token lives in .env (gitignored).

services:
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN:-}
    # 参加するネットワークは 4 本だけ。common 環境のサービス（metabase /
    # prisma-studio / grafana）は Coolify 管理になり、いずれも `coolify` に
    # 出ているので、スタック固有のネットワーク名を知る必要が無くなった。
    # 旧構成は 8 本を名前で参照していたが、Coolify 化でネットワーク名が
    # `<appUUID>_...` に変わり、`shared-db` に至っては退役して消えている。
    # 名前を追いかけ続けると、移行のたびにここが壊れる。
    # **1 本だけ。** 以前は各スタックの compose 網を名前で 4〜8 本たぐって
    # いたが、移行のたびに名前が変わって（`<appUUID>_...`）参照側が壊れた。
    # 全サービスが `coolify` 網に別名で出ている今、たぐる必要が無い:
    #   web / web-main / kiosk / kiosk-main / admin / admin-dev … Coolify アプリの別名
    #   dockge（portainer）/ open-webui / metabase / grafana / coolify 本体
    networks:
      - coolify

# Attach to each target stack's compose network so the tunnel can resolve them.
networks:
  coolify:
    external: true
    name: coolify
