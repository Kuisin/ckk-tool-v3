# CKK db-backup — scheduled PG17 incremental base backups of the production DB.
#
# ⚠️ **このスタックは意図的に Coolify 管理にしない。** `deploy-stack.sh db-backup`
# で直接デプロイする（`coolify` スタック本体と同じ扱い）。
#
# 理由: バックアップは**復旧手段**なので、復旧したい相手（Coolify）に依存させない。
# Coolify が壊れた・設定を壊した・ボリュームを取り違えた、というときにこそ
# バックアップが要る。その状況で「バックアップも Coolify 管理でした」では
# 手が無くなる。restore-agent が Coolify API を叩く構成であることも踏まえ、
# 実行基盤としては独立させておく。
#
# スクリプトはイメージへ焼き込んである（bind mount をやめた）。直接デプロイなら
# bind mount でも動くが、焼き込んでおけば「どこから実行しても同じ」になり、
# 将来 Coolify へ移す判断をしても壊れない。
#
# 2026-08-24: 本番は `shared-db` から Coolify 管理の `ckk-db-main` へ移行した。
# バックアップ対象も追随させる（`PGHOST` / `LOGICAL_DB_URL` / `RESTORE_DB_URL`）。
# 対象は **本番だけ** — dev（ckk-db-dev）は取らない。
#
# One loop container ticks at the top of every hour (kot-import style):
#   daily/YYYY-MM-DD/      full pg_basebackup      — kept DAILY_KEEP_DAYS (14)
#   hourly/YYYY-MM-DDTHH/  incremental (vs newest full) — kept HOURLY_KEEP_HOURS (72)
#   monthly/YYYY-MM/       hardlink promote of the month's first daily full
#                                                  — kept MONTHLY_KEEP (12)
#
# Backups land on the host at ${BACKUP_DIR:-/data/db-backups} (create it once:
# `sudo mkdir -p /data/db-backups && sudo chown 70:70 /data/db-backups`).
# Restore runbook + one-time shared-db migration steps: see README.md.

services:
  db-backup:
    build: .
    image: ckk-db-backup
    container_name: db-backup
    restart: unless-stopped
    user: "70:70" # postgres uid/gid in the alpine image; matches BACKUP_DIR chown
    environment:
      # 本番 DB。Coolify アプリなのでコンテナ名はハッシュ — `coolify` ネットワーク上の
      # 安定した別名 `ckk-db-main` で引く。
      - PGHOST=${PGHOST:-ckk-db-main}
      - PGUSER=backup
      - PGPASSWORD=${BACKUP_DB_PASSWORD:?set BACKUP_DB_PASSWORD in .env}
      - TZ=${TZ:-Asia/Tokyo} # daily/monthly boundaries in local time
      - BACKUP_ROOT=/backups
      - HOURLY_KEEP_HOURS=${HOURLY_KEEP_HOURS:-72}
      - DAILY_KEEP_DAYS=${DAILY_KEEP_DAYS:-14}
      - MONTHLY_KEEP=${MONTHLY_KEEP:-12}
    volumes:
      - ${BACKUP_DIR:-/data/db-backups}:/backups
    networks:
      - coolify

  # 日次の論理バックアップ（pg_dump カスタム形式）。restore-agent がワンクリック
  # 復元できる自己完結スナップショット（物理 basebackup とは別レイヤ）。
  # LOGICAL_DB_URL 未設定なら待機のみ（安全に無効）。
  logical-dump:
    build: . # db-backup と同じ pg17 クライアント入りイメージ（同一コンテキスト → キャッシュ共有）
    image: ckk-db-backup
    container_name: logical-dump
    restart: unless-stopped
    user: "70:70"
    environment:
      - TZ=${TZ:-Asia/Tokyo}
      - LOGICAL_DB_URL=${LOGICAL_DB_URL:-} # = restore-agent の RESTORE_DB_URL（スーパーユーザ DSN）
      - LOGICAL_KEEP_DAYS=${LOGICAL_KEEP_DAYS:-14}
      - LOGICAL_MONTHLY_KEEP=${LOGICAL_MONTHLY_KEEP:-12}
    entrypoint: ["/bin/bash", "/usr/local/bin/logical-dump.sh"]
    volumes:
      - ${BACKUP_DIR:-/data/db-backups}:/backups
    networks:
      - coolify

  # 復元エグゼキュータ。admintools UI から token 付きで呼ばれ、DB（pg_restore）と
  # SeaweedFS ボリュームの復元を実行する。docker.sock を持つのはこの非公開サービス
  # のみ（web-facing の admintools はソケットに触れない）。RESTORE_AGENT_TOKEN 未設定
  # なら全操作 401、RESTORE_DB_URL 未設定なら DB 復元のみ無効。
  restore-agent:
    build: ./restore-agent
    image: ckk-restore-agent
    container_name: restore-agent
    restart: unless-stopped
    environment:
      - TZ=${TZ:-Asia/Tokyo}
      - BACKUP_DIR=/backups
      - BACKUP_HOST_DIR=${BACKUP_DIR:-/data/db-backups} # ワンショット bind mount 用のホストパス
      - RESTORE_AGENT_TOKEN=${RESTORE_AGENT_TOKEN:-}
      - RESTORE_DB_URL=${RESTORE_DB_URL:-} # ckk へのスーパーユーザ DSN（空 = DB 復元無効）
      - SEAWEED_CONTAINER=${SEAWEED_CONTAINER:-seaweedfs-main}
      # 2026-08-25: 保管先を名前付きボリュームからホストの固定パスへ移した
      # （Coolify がボリュームを `<appUUID>_<name>` へ改名するため — ../app-support）。
      # docker SDK はボリューム名でもホストパスでもマウント元にできるので、
      # 変数名はそのままで値だけパスにしてある。
      - SEAWEED_VOLUME=${SEAWEED_VOLUME:-/data/seaweed-main}
      - SHARED_DB_NETWORK=${SHARED_DB_NETWORK:-coolify}
      # 物理復元（全停止）: 本番 DB を止めてデータボリュームを入れ替える。
      # ckk-db-main は Coolify アプリなのでコンテナ名もボリューム名もハッシュ入り。
      # **アプリを作り直すと両方変わる**ので、復元前に必ず現物を確認すること
      # （README「物理復元」を参照）。
      - SHARED_DB_CONTAINER=${SHARED_DB_CONTAINER:?set SHARED_DB_CONTAINER in .env}
      - SHARED_DB_VOLUME=${SHARED_DB_VOLUME:?set SHARED_DB_VOLUME in .env}
      # Coolify — 復元ポイントの git commit へアプリを戻す（空 = アプリ復元無効）
      - COOLIFY_API_URL=${COOLIFY_API_URL:-} # 例: http://coolify:8000/api/v1
      - COOLIFY_API_TOKEN=${COOLIFY_API_TOKEN:-}
      - COOLIFY_APP_NAME=${COOLIFY_APP_NAME:-nextjs-web-main}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${BACKUP_DIR:-/data/db-backups}:/backups
    networks:
      - coolify # Coolify API（coolify:8000）到達用

  # SeaweedFS（受注書スキャン原本・証憑・生成 PDF）の日次 tar スナップショット。
  # 本番の保管ディレクトリ /data/seaweed-main を read-only でマウントする。
  seaweed-backup:
    build:
      context: .
      dockerfile: seaweed/Dockerfile
    image: ckk-seaweed-backup
    container_name: seaweed-backup
    restart: unless-stopped
    environment:
      - TZ=${TZ:-Asia/Tokyo}
      - SEAWEED_KEEP_DAYS=${SEAWEED_KEEP_DAYS:-14}
      - SEAWEED_MONTHLY_KEEP=${SEAWEED_MONTHLY_KEEP:-12}
    entrypoint: ["/bin/sh", "/seaweed-backup.sh"]
    volumes:
      - ${SEAWEED_VOLUME:-/data/seaweed-main}:/seaweed-data:ro
      - ${BACKUP_DIR:-/data/db-backups}:/backups

  # 補助バックアップ — 「git repo + /backups だけでサーバー全損から完全復旧」を
  # 成立させる残り要素を毎日 03時台に取得: 周辺 PostgreSQL（authentik/coolify/
  # metabase/legacy の docker exec pg_dump）・Grafana データ・サーバー限定シーク
  # レット（~/stacks/*/.env 等）の AES-256 暗号化 tar。ENV_SNAPSHOT_PASSPHRASE は
  # サーバー外（パスワードマネージャ）にも必ず控えること。restore-agent と同様
  # docker.sock を持つ非公開サービス。
  aux-backup:
    build: ./aux
    image: ckk-aux-backup
    container_name: aux-backup
    restart: unless-stopped
    environment:
      - TZ=${TZ:-Asia/Tokyo}
      - AUX_KEEP_DAYS=${AUX_KEEP_DAYS:-14}
      - AUX_MONTHLY_KEEP=${AUX_MONTHLY_KEEP:-12}
      - ENV_SNAPSHOT_PASSPHRASE=${ENV_SNAPSHOT_PASSPHRASE:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${BACKUP_DIR:-/data/db-backups}:/backups
      - ${STACKS_DIR:-/home/kaiseisawada/stacks}:/host-stacks:ro
      - ${COOLIFY_SOURCE_DIR:-/data/coolify/source}:/coolify-source:ro
      - grafana-data:/grafana-data:ro

  # オフサイト同期（rclone + inotify）— バックアップが /data/db-backups に作られた
  # 瞬間にクラウドへ copy し、04時台に日次 mirror で保持を追従。OFFSITE_REMOTE
  # 未設定時は待機のみ（安全に無効）。設定は README 参照。
  offsite-backup:
    # スクリプト（offsite-sync.sh）はこのディレクトリ直下にあるので、
    # コンテキストは `.`、Dockerfile だけ offsite/ から取る（seaweed と同じ形）。
    build:
      context: .
      dockerfile: offsite/Dockerfile # rclone/rclone:1.68 + inotify-tools
    image: ckk-offsite-backup
    container_name: offsite-backup
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/offsite-sync.sh"]
    volumes:
      - ${BACKUP_DIR:-/data/db-backups}:/backups:ro
    environment:
      - TZ=${TZ:-Asia/Tokyo}
      - OFFSITE_REMOTE=${OFFSITE_REMOTE:-}
      # rclone リモートは RCLONE_CONFIG_* 環境変数で定義（.env に置く）
      - RCLONE_CONFIG_SAKURA_TYPE=${RCLONE_CONFIG_SAKURA_TYPE:-}
      - RCLONE_CONFIG_SAKURA_HOST=${RCLONE_CONFIG_SAKURA_HOST:-}
      - RCLONE_CONFIG_SAKURA_USER=${RCLONE_CONFIG_SAKURA_USER:-}
      - RCLONE_CONFIG_SAKURA_PASS=${RCLONE_CONFIG_SAKURA_PASS:-}
      - RCLONE_CONFIG_R2_TYPE=${RCLONE_CONFIG_R2_TYPE:-}
      - RCLONE_CONFIG_R2_PROVIDER=${RCLONE_CONFIG_R2_PROVIDER:-}
      - RCLONE_CONFIG_R2_ACCESS_KEY_ID=${RCLONE_CONFIG_R2_ACCESS_KEY_ID:-}
      - RCLONE_CONFIG_R2_SECRET_ACCESS_KEY=${RCLONE_CONFIG_R2_SECRET_ACCESS_KEY:-}
      - RCLONE_CONFIG_R2_ENDPOINT=${RCLONE_CONFIG_R2_ENDPOINT:-}
      # object 権限だけのトークンは CreateBucket できない。rclone は既定で
      # アップロード前にバケットの存在確認（無ければ作成）をするため、これを
      # 止めないと毎回 403 AccessDenied になる（実際に踏んだ）。
      - RCLONE_CONFIG_R2_NO_CHECK_BUCKET=${RCLONE_CONFIG_R2_NO_CHECK_BUCKET:-}
      # crypt リモート — R2 の上に被せてクライアント側で暗号化する。
      # バックアップには業務文書と個人情報（login_attempts の IP・端末シグネチャ、
      # 従業員マスタ）が入るので、平文でクラウドへ置かない。事業者が持つのは
      # 暗号文だけになるため、越境移転の判断も単純になる。
      # ★ RCLONE_CONFIG_R2CRYPT_PASSWORD/_PASSWORD2 は `rclone obscure` した値。
      #   平文パスフレーズは**サーバー外**（Keychain / パスワードマネージャ）にも
      #   必ず置く — これを失うとバックアップは永久に復号できない。
      - RCLONE_CONFIG_R2CRYPT_TYPE=${RCLONE_CONFIG_R2CRYPT_TYPE:-}
      - RCLONE_CONFIG_R2CRYPT_REMOTE=${RCLONE_CONFIG_R2CRYPT_REMOTE:-}
      - RCLONE_CONFIG_R2CRYPT_PASSWORD=${RCLONE_CONFIG_R2CRYPT_PASSWORD:-}
      - RCLONE_CONFIG_R2CRYPT_PASSWORD2=${RCLONE_CONFIG_R2CRYPT_PASSWORD2:-}
      # 送る対象（空白区切り）。既定は offsite-sync.sh 内の最小集合。
      - OFFSITE_INCLUDE=${OFFSITE_INCLUDE:-}

volumes:
  # Grafana は Coolify 管理になったのでボリューム名にアプリ UUID が入る。
  # 既定値のままだと**退役した空のボリューム**を掴む（気付きにくい）。
  grafana-data:
    external: true
    name: ${GRAFANA_VOLUME:?set GRAFANA_VOLUME in .env}

networks:
  coolify:
    external: true
    name: coolify
