# Metabase — BI / analytics dashboards.
#
# ⚠️ **このスタックは Coolify 管理**（プロジェクト ckk / `common` 環境 / dev 追従）。
# `deploy-stack.sh metabase` を使わないこと — Coolify が建てたコンテナと二重になる。
#
#   metabase     host :3003 -> container :3000  (UI)
#   metabase-db  internal Postgres (app metadata)
#
# データソースは **新しい環境別 DB** を見る（旧 shared-db は退役するので繋がない）:
#   CKK 業務        → ckk-db-main (metabase_ro)  ※本番。業務データが入り次第埋まる
#   CKK 業務 (dev)  → ckk-db-dev  (metabase_ro)
#   King of Time    → ckk-db-main (kot_ro)       ※労務データは移行済み
# いずれも `coolify` ネットワーク上の別名で引く。

services:
  metabase-db:
    image: postgres:17-alpine
    container_name: metabase-db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=metabase
      - POSTGRES_USER=metabase
      - POSTGRES_PASSWORD=${MB_DB_PASS:?set MB_DB_PASS in .env}
    volumes:
      - metabase-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metabase"]
      interval: 10s
      timeout: 5s
      retries: 5

  metabase:
    image: metabase/metabase:v0.63.14
    container_name: metabase
    restart: unless-stopped
    depends_on:
      metabase-db:
        condition: service_healthy
    environment:
      - MB_DB_TYPE=postgres
      - MB_DB_HOST=metabase-db
      - MB_DB_PORT=5432
      - MB_DB_DBNAME=metabase
      - MB_DB_USER=metabase
      - MB_DB_PASS=${MB_DB_PASS:?set MB_DB_PASS in .env}
      # Encrypts saved data-source credentials at rest in the app DB.
      - MB_ENCRYPTION_SECRET_KEY=${MB_ENCRYPTION_SECRET_KEY:?set MB_ENCRYPTION_SECRET_KEY in .env}
      # Signed embedding — 現場の管理ディスプレイ（SY09 端末管理）がダッシュボードを
      # iframe で映すために要る。埋め込みトークンはアプリ側（nextjs-kiosk の
      # lib/metabase-embed.ts）がこの鍵で HS256 署名する。
      #
      # ★ 拠点・ラインの絞り込みは、**ダッシュボードごとに Metabase の画面で
      #   「ロック」に設定すること**。ロックしないと JWT の値は単なる初期値に
      #   なり、URL から上書きできてしまう（＝壁の画面から他拠点が覗ける）。
      - MB_ENABLE_EMBEDDING=true
      - MB_EMBEDDING_SECRET_KEY=${MB_EMBEDDING_SECRET_KEY:?set MB_EMBEDDING_SECRET_KEY in .env}
      # AD/LDAP auth via the vpn-ldap forwarder. Bind creds mirror vpn-ldap/ldap.env.
      - MB_LDAP_ENABLED=true
      - MB_LDAP_HOST=vpn-ldap
      - MB_LDAP_PORT=389
      - MB_LDAP_SECURITY=none
      - MB_LDAP_BIND_DN=${LDAP_APP_DN:?set LDAP_APP_DN in .env}
      - MB_LDAP_PASSWORD=${LDAP_APP_PASSWORD:?set LDAP_APP_PASSWORD in .env}
      - MB_LDAP_USER_BASE=DC=ckk-tools,DC=loc
      - "MB_LDAP_USER_FILTER=(&(objectClass=user)(|(sAMAccountName={login})(mail={login})(userPrincipalName={login})))"
      - MB_LDAP_ATTRIBUTE_EMAIL=mail
      - MB_LDAP_ATTRIBUTE_FIRSTNAME=givenName
      - MB_LDAP_ATTRIBUTE_LASTNAME=sn
    networks:
      - default     # metabase-db
      - ldap        # ckk-ldap — reach vpn-ldap:389
      - coolify     # ckk-db-main / ckk-db-dev（業務・労務データ）と
                    # ollama:11434（Metabot/AI 用 LLM）。旧 shared-db ネットワークは
                    # 退役に伴い外した — データは環境別 DB へ移行済み。
    ports:
      - "3003:3000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 120s

volumes:
  metabase-db-data:

networks:
  # AD を読む相手を繋ぐ網（../ai-stack / ../vpn-ldap と同じ 1 本）。
  # 到達制御ではない点は ../README.md「スタックをまたぐ接続」を参照。
  ldap:
    external: true
    name: ckk-ldap
  # Coolify network — 業務 DB（ckk-db-main / ckk-db-dev）と ollama（LLM, GPU）。
  coolify:
    external: true
    name: coolify
