# Hardware monitoring — Prometheus + exporters + Grafana (techstack #7).
#
# Deployed on docker-mac-pro at ~/stacks/monitoring (Dockge-managed).
#   grafana       host :3002  — dashboards & alerts (also public via cloudflared)
#   prometheus    internal    — metrics store, scrapes the exporters below
#   node-exporter internal    — host CPU / RAM / disk / net / temps
#   cadvisor      internal    — per-container CPU / mem (ollama, open-webui, ...)
#   gpu-exporter  internal    — AMD GPU util / VRAM / temp / power (amdgpu sysfs)
#
# Grafana is provisioned with the Prometheus datasource + an "AMD GPU & System"
# dashboard. Public hostname (monitor.kai-lab.net) is added on the cloudflared stack.

services:
  prometheus:
    build:
      context: .
      dockerfile: images/prometheus.Dockerfile
    image: ckk-prometheus
    container_name: prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=30d'
    volumes:
      - prometheus-data:/prometheus
    networks: [monitoring]

  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: node-exporter
    restart: unless-stopped
    pid: host
    command:
      - '--path.rootfs=/host'
    volumes:
      - /:/host:ro,rslave
    networks: [monitoring]

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: cadvisor
    restart: unless-stopped
    privileged: true
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks: [monitoring]

  gpu-exporter:
    build: ./gpu-exporter
    image: amdgpu-sysfs-exporter
    container_name: gpu-exporter
    restart: unless-stopped
    volumes:
      - /sys:/sys:ro
    networks: [monitoring]

  # コンテナのメタ情報を Prometheus 形式で出す自前 exporter。
  # docker.sock は読み取り専用でマウントするが、API 自体は強い権限を持つ
  # （cadvisor / portainer と同じ前提）。外には出さない。
  #
  # ⚠️ この定義は長らく**サーバー側の compose にしか無かった**（リポジトリ未コミット）。
  # Coolify は git から建てるので移行時に丸ごと消え、そこで発覚した。
  # サーバーを直接編集すると、こうして黙って失われる。
  docker-exporter:
    build: ./docker-exporter
    image: ckk-docker-exporter
    container_name: docker-exporter
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [monitoring]

  # Log store for container logs (collected by Alloy below).
  loki:
    build:
      context: .
      dockerfile: images/loki.Dockerfile
    image: ckk-loki
    container_name: loki
    restart: unless-stopped
    command: -config.file=/etc/loki/loki-config.yaml
    volumes:
      - loki-data:/loki
    networks: [monitoring]

  # Collects EVERY container's stdout/stderr (via the Docker socket) -> Loki.
  alloy:
    build:
      context: .
      dockerfile: images/alloy.Dockerfile
    image: ckk-alloy
    container_name: alloy
    restart: unless-stopped
    depends_on:
      - loki
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/var/lib/alloy/data
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data
    networks: [monitoring]

  grafana:
    build:
      context: .
      dockerfile: images/grafana.Dockerfile
    image: ckk-grafana
    container_name: grafana
    restart: unless-stopped
    depends_on:
      - prometheus
      - loki
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GF_ADMIN_PASSWORD:-admin}
      - GF_SERVER_ROOT_URL=${GF_ROOT_URL:-http://localhost:3002}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
    networks: [monitoring]

volumes:
  # external — Coolify がプロジェクト名（アプリ UUID）を変えても同じ実体を
  # 掴む。名前付きのままだと新しい空ボリュームができて履歴が孤児になる。
  prometheus-data:
    external: true
    name: monitoring_prometheus-data
  grafana-data:
    external: true
    name: monitoring_grafana-data
  loki-data:
    external: true
    name: monitoring_loki-data
  alloy-data:
    external: true
    name: monitoring_alloy-data

networks:
  monitoring:
