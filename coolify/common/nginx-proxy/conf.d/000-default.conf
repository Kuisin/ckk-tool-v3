# 既定サーバー（どの server_name にも一致しなかったリクエストの受け皿）。
#
# **これが無いと、nginx は conf.d の先頭のファイル（アルファベット順で
# admin.ckk-tool.co.jp）を既定サーバーとして使う。** つまり 192.168.50.15 に
# 解決する“知らないホスト名”で来ると adminTools が出る — あれは自前の認証を
# 持たず Cloudflare Access だけで守られているので、LAN からは素通しになる。
# 実際、ckk.kai-lab.net を廃止した直後に、その名前で adminTools が見えていた。
#
# ファイル名を 000- で始めているのは、既定サーバーを「先頭のファイル」に
# するため（この仕組みに依存している以上、名前で順序を固定するのが確実）。
#
# 444 = 応答を返さずに接続を閉じる nginx 独自コード。存在を教えないので、
# ホスト名の総当たりに対しても何も漏らさない。

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name _;

    # TLS ハンドシェイクは Host が判る前に起きるので、既定サーバーにも証明書が要る。
    # 中身は問わない（どの名前にも一致しない接続なので）— 手持ちのワイルドカードを使う。
    ssl_certificate     /secrets/nginx/certs/_.ckk-tool.co.jp.crt;
    ssl_certificate_key /secrets/nginx/certs/_.ckk-tool.co.jp.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 444;
}
