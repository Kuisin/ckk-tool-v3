# app-dev.ckk-tool.co.jp -> nextjs-web DEV app (web:3000 relay -> Coolify :3004).
# Mirrors the Cloudflare Tunnel route app-dev.ckk-tool.co.jp -> http://web:3000.
# TLS: *.ckk-tool.co.jp wildcard.
# Also needs: LAN DNS app-dev.ckk-tool.co.jp -> 192.168.50.15.
#
# 旧 ckk-dev.kai-lab.net / dev.kai-lab.net はこれに統合した。

server {
    listen 80;
    listen [::]:80;
    server_name app-dev.ckk-tool.co.jp;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name app-dev.ckk-tool.co.jp;

    ssl_certificate     /etc/nginx/certs/_.ckk-tool.co.jp.crt;
    ssl_certificate_key /etc/nginx/certs/_.ckk-tool.co.jp.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    # Allow large uploads (PDFs for extraction, etc.).
    client_max_body_size 50m;

    location / {
        proxy_pass http://web:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket / SSE upgrade passthrough.
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 300s;
    }
}
