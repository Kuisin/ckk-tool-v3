# app.ckk-tool.co.jp -> nextjs-web PRODUCTION app (web-main:3000 relay -> Coolify :3005).
# Mirrors the Cloudflare Tunnel route app.ckk-tool.co.jp -> http://web-main:3000.
# TLS: *.ckk-tool.co.jp wildcard.
# Also needs: LAN DNS app.ckk-tool.co.jp -> 192.168.50.15.
#
# 旧 ckk.kai-lab.net はこれに統合した（Authentik のリダイレクト URI 更新に伴い、
# アプリのホスト名は ckk-tool.co.jp に一本化）。キオスクだけは kai-lab のまま
# （将来 LAN 専用にする方針のため）。

server {
    listen 80;
    listen [::]:80;
    server_name app.ckk-tool.co.jp;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name app.ckk-tool.co.jp;

    ssl_certificate     /secrets/nginx/certs/_.ckk-tool.co.jp.crt;
    ssl_certificate_key /secrets/nginx/certs/_.ckk-tool.co.jp.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    # Allow large uploads (PDFs for extraction, etc.).
    client_max_body_size 50m;

    location / {
        proxy_pass http://web-main:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket / SSE upgrade passthrough.
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 300s;
    }
}
