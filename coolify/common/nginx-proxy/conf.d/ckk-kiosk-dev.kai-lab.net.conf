# ckk-kiosk-dev.kai-lab.net -> nextjs-kiosk DEV app (kiosk:3000 relay -> Coolify :3006).
# Mirrors the Cloudflare Tunnel route ckk-kiosk-dev.kai-lab.net -> http://kiosk:3000.
# TLS: ckk-kiosk.kai-lab.net cert (SAN includes ckk-kiosk-dev.kai-lab.net) —
#   docker exec nginx-acme --issue --dns dns_cf \
#     -d ckk-kiosk.kai-lab.net -d ckk-kiosk-dev.kai-lab.net --server letsencrypt
#   docker exec nginx-acme --install-cert -d ckk-kiosk.kai-lab.net \
#     --key-file /certs/ckk-kiosk.kai-lab.net.key \
#     --fullchain-file /certs/ckk-kiosk.kai-lab.net.crt
# Also needs: LAN DNS ckk-kiosk-dev.kai-lab.net -> 192.168.50.15.
# WebSocket: /api/kiosk/ws のプレゼンス接続があるため upgrade ヘッダ + 長い
# read timeout を全体に適用（既存 vhost と同じ設定で足りる）。

server {
    listen 80;
    listen [::]:80;
    server_name ckk-kiosk-dev.kai-lab.net;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ckk-kiosk-dev.kai-lab.net;

    ssl_certificate     /secrets/nginx/certs/ckk-kiosk.kai-lab.net.crt;
    ssl_certificate_key /secrets/nginx/certs/ckk-kiosk.kai-lab.net.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    client_max_body_size 20m;

    location / {
        proxy_pass http://kiosk:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket (/api/kiosk/ws) upgrade passthrough.
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 300s;
    }
}
