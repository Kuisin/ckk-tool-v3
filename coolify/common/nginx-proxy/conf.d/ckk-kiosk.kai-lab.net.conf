# ckk-kiosk.kai-lab.net -> nextjs-kiosk MAIN app (kiosk-main:3000 relay -> Coolify :3007).
# Mirrors the Cloudflare Tunnel route ckk-kiosk.kai-lab.net -> http://kiosk-main:3000.
# TLS: ckk-kiosk.kai-lab.net cert (issuance command: see ckk-kiosk-dev vhost).
# Also needs: LAN DNS ckk-kiosk.kai-lab.net -> 192.168.50.15.

server {
    listen 80;
    listen [::]:80;
    server_name ckk-kiosk.kai-lab.net;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ckk-kiosk.kai-lab.net;

    ssl_certificate     /secrets/nginx/certs/ckk-kiosk.kai-lab.net.crt;
    ssl_certificate_key /secrets/nginx/certs/ckk-kiosk.kai-lab.net.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    client_max_body_size 20m;

    location / {
        proxy_pass http://kiosk-main:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket (/api/kiosk/ws) upgrade passthrough.
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 300s;
    }
}
