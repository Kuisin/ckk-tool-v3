# dock.kai-lab.net -> Dockge (dockge:5001), LAN TLS termination.
# LAN access bypasses Cloudflare Access (which only enforces at CF's edge).

server {
    listen 80;
    listen [::]:80;
    server_name dock.kai-lab.net;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name dock.kai-lab.net;

    ssl_certificate     /etc/nginx/certs/dock.kai-lab.net.crt;
    ssl_certificate_key /etc/nginx/certs/dock.kai-lab.net.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    # Coolify はデプロイの度にコンテナを作り直すため upstream の IP が変わる。
    # proxy_pass にホスト名を直書きすると nginx が起動時の IP を握り続け、
    # 再デプロイのたびに 502 になる（手動 reload が必要だった）。変数にすると
    # リクエストごとに resolver を引くので追従する。127.0.0.11 = Docker の DNS。
    resolver 127.0.0.11 valid=10s ipv6=off;

    location / {
        set $upstream http://dockge:5001;
        proxy_pass $upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;   # Dockge socket.io (WS)
        proxy_set_header Connection        "upgrade";
    }
}
