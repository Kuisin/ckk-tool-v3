# kiosk-dev.ckk-tools.loc -> nextjs-kiosk DEV app (kiosk:3000 relay -> Coolify :3006).
# 社内専用。証明書の発行手順は kiosk.ckk-tools.loc.conf の先頭を参照（社内 CA で署名）。
# 前提: 社内 DNS で kiosk-dev.ckk-tools.loc -> 192.168.50.15。

server {
    listen 80;
    listen [::]:80;
    server_name kiosk-dev.ckk-tools.loc;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name kiosk-dev.ckk-tools.loc;

    ssl_certificate     /etc/nginx/certs/kiosk-dev.ckk-tools.loc.crt;
    ssl_certificate_key /etc/nginx/certs/kiosk-dev.ckk-tools.loc.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    client_max_body_size 20m;

    location / {
        proxy_pass http://kiosk:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket (/api/kiosk/ws) upgrade passthrough.
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 300s;
    }
}
