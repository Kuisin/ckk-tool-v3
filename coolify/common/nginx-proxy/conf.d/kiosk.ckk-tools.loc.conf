# kiosk.ckk-tools.loc -> nextjs-kiosk MAIN app (kiosk-main:3000 relay -> Coolify :3007).
#
# 社内専用のアドレス。キオスクは現場タブレット専用なので、将来は
# **社内ネットワークからのみ**到達できるようにする方針で、Cloudflare の
# トンネルには載せない（公開しない）。
#
# TLS: `.loc` は公開 TLD ではないため Let's Encrypt を取れない → **社内 CA で署名**。
#
#   なぜ自己署名（単体）ではなく CA か: Android のトラストアンカーは **CA 証明書**
#   でなければならず、CA:FALSE の自己署名リーフはアンカーにできない。CA にして
#   おけば、今後 .loc のサービスが増えてもリーフを発行するだけで済む（アプリの
#   再ビルドが要らない）。
#
#   発行（サーバー上・certs/ は gitignore。CA 秘密鍵はここから出さない）:
#     # CA（初回のみ）
#     openssl req -x509 -newkey rsa:4096 -nodes -days 7300 \
#       -keyout ckk-internal-ca.key -out ckk-internal-ca.crt \
#       -subj "/CN=CKK Internal CA/O=CKK" \
#       -addext "basicConstraints=critical,CA:TRUE,pathlen:0" \
#       -addext "keyUsage=critical,keyCertSign,cRLSign"
#     # リーフ（host ごと）— SAN 必須。nginx へは リーフ + CA を連結して置く
#     openssl req -newkey rsa:2048 -nodes -keyout <host>.key -out <host>.csr -subj "/CN=<host>"
#     openssl x509 -req -in <host>.csr -CA ckk-internal-ca.crt -CAkey ckk-internal-ca.key \
#       -CAcreateserial -out <host>.leaf.crt -days 3650 -sha256 -extfile <ext>
#     cat <host>.leaf.crt ckk-internal-ca.crt > <host>.crt
#
# 前提:
#   - 社内 DNS で kiosk.ckk-tools.loc -> 192.168.50.15（ckk-tools.loc は AD の
#     ドメインなので AD DNS に A レコードを足す）。
#   - タブレット側は **CA 証明書をアプリに同梱**して信頼する
#     （android-kiosk: res/raw/ckk_internal_ca.pem + res/xml/network_security_config.xml）。
#     端末ごとの証明書インストールは不要 — targetSdk 35 では
#     ユーザー領域にインストールした CA をアプリは信頼しないため、同梱以外に手は無い。

server {
    listen 80;
    listen [::]:80;
    server_name kiosk.ckk-tools.loc;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name kiosk.ckk-tools.loc;

    ssl_certificate     /secrets/nginx/certs/kiosk.ckk-tools.loc.crt;
    ssl_certificate_key /secrets/nginx/certs/kiosk.ckk-tools.loc.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    client_max_body_size 20m;

    location / {
        proxy_pass http://kiosk-main:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket (/api/kiosk/ws) upgrade passthrough.
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 300s;
    }
}
