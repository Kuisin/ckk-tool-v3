# Nginx reverse proxy / TLS terminator (techstack #8) + acme.sh for Let's Encrypt.
#
# Fronts the app for LOCAL access: terminates HTTPS for app-dev.ckk-tool.co.jp on the
# LAN and proxies to the nextjs-web `web` service over its compose network.
# Pair with a LAN DNS override (app-dev.ckk-tool.co.jp -> 192.168.50.15) so internal
# clients reach this proxy directly instead of hairpinning out via Cloudflare.
#
# - acme : issues/renews a Let's Encrypt cert via Cloudflare DNS-01 (no inbound
#          ports), installing it into the shared ./certs volume; daemon mode
#          re-checks renewals daily.
# - nginx: serves ./certs and self-reloads daily so renewed certs apply without
#          a manual restart.
#
# Deployed on docker-mac-pro at ~/stacks/nginx-proxy (Dockge-managed).
# ./certs, ./acme and .env are gitignored — see README for issuance steps.

services:
  acme:
    image: neilpang/acme.sh:latest
    container_name: nginx-acme
    restart: unless-stopped
    command: daemon
    environment:
      - CF_Token=${CLOUDFLARE_DNS_API_TOKEN:-}
    # 秘密は 1 本のボリューム（ckk-secrets）に集約しつつ、**subpath** で
    # 各コンテナが従来どおりのパスで見えるようにする。acme.sh は自分の state が
    # /acme.sh にある前提で動き、LE_WORKING_DIR を実行時に見ない（この前提を
    # 曲げると --list が空になり、更新が静かに止まる）。
    volumes:
      - /data/ckk-secrets/nginx/acme:/acme.sh   # acme.sh の state（書き込みあり）
      - /data/ckk-secrets/nginx/certs:/certs     # 発行した証明書の設置先

  nginx:
    image: nginx:1.28
    container_name: nginx-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./conf.d:/etc/nginx/conf.d:ro
      # 証明書は秘密ボリュームの subpath から。パスは従来どおりなので vhost の
      # 設定は書き換えなくてよい。
      - /data/ckk-secrets/nginx/certs:/etc/nginx/certs:ro
    # **1 本だけ。** 以前は各スタックの compose 網を名前で 4〜8 本たぐって
    # いたが、移行のたびに名前が変わって（`<appUUID>_...`）参照側が壊れた。
    # 全サービスが `coolify` 網に別名で出ている今、たぐる必要が無い:
    #   web / web-main / kiosk / kiosk-main / admin / admin-dev … Coolify アプリの別名
    #   dockge（portainer）/ open-webui / metabase / grafana / coolify 本体
    networks:
      - coolify
    # Reload daily so renewed certs from acme.sh are applied without a restart.
    command: ["sh", "-c", "(while :; do sleep 86400; nginx -s reload 2>/dev/null || true; done &) ; exec nginx -g 'daemon off;'"]

# Attach to each app's compose network so proxy_pass resolves the service names.
networks:
  coolify:
    external: true
    name: coolify

