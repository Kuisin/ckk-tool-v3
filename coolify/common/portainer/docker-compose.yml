# Portainer CE — Docker management UI (replaces Dockge).
#
# Deployed on docker-mac-pro at ~/stacks/portainer.
# Serves plain HTTP on :5001 and joins the `coolify` network with the
# alias `dockge`, so the existing cloudflared tunnel + nginx routes
# (dock.kai-lab.net -> http://dockge:5001) keep working unchanged.

services:
  portainer:
    image: portainer/portainer-ce:2.39.3
    container_name: portainer
    restart: unless-stopped
    # Serve HTTP on 5001 (reverse-proxied / tunnelled); HTTPS stays on 9443 unused.
    command: --http-enabled --bind :5001
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer-data:/data
    networks:
      coolify:
        aliases:
          - dockge           # so http://dockge:5001 resolves here

volumes:
  portainer-data:

# 2026-08-25: 旧 `dockge_default` を捨てて `coolify` 網へ寄せた。別名 `dockge` は
# そのままなので nginx / cloudflared の設定は変えなくてよい。スタック固有の
# ネットワーク名を追いかけ続けると、移行のたびに参照側が壊れる。
networks:
  coolify:
    external: true
    name: coolify
