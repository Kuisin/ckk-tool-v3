# secrets — 機微ファイルを持つ ckk-secrets ボリュームの「持ち主」。
#
# ⚠️ **Coolify 管理**（プロジェクト ckk / `common` 環境）。
#
# なぜコンテナを 1 つ置くのか: ボリュームだけだと**どのスタックのものでもない**
# 状態になり、Coolify の画面にも出ず、棚卸しでも見落とされる。スクリプトで
# 作った野良ボリュームは、そのうち「これは何だったか」になる。
# ここで所有者を明示し、同時に中身の健全性を定期的に確かめる。
#
# このコンテナは秘密を**外に出さない**。読むだけで、ログに出すのは
# 「あるか / 何個か」だけ。中身は決して表示しない。

services:
  secrets-vault:
    image: alpine:3.21
    container_name: secrets-vault
    restart: unless-stopped
    # **bind mount であることが重要。** Coolify は compose の名前付きボリュームを
    # `external: true` と書いても `<appUUID>_<name>` へ改名するため、複数アプリで
    # 1 本を共有できない（実際に空のボリュームを掴んで全項目 MISSING になった）。
    # bind mount はそのまま渡るので、ホストの固定パスに置く。
    volumes:
      - /data/ckk-secrets:/secrets:ro
    # 15 分ごとに健全性を確認して stdout へ（Alloy が拾い Loki に入る）。
    # 特に **社内 CA の秘密鍵**は再生成すると全キオスク端末の信頼が切れるので、
    # 名指しで存在を見る。消えたことに後から気付く事態を避ける。
    command:
      - sh
      - -c
      - |
        while :; do
          certs=$$(ls /secrets/nginx/certs 2>/dev/null | wc -l)
          acme=$$(ls -A /secrets/nginx/acme 2>/dev/null | wc -l)
          ca=$$(test -f /secrets/nginx/certs/ckk-internal-ca.key && echo present || echo MISSING)
          vpn=$$(test -f /secrets/vpn/config.ovpn && echo present || echo MISSING)
          searx=$$(test -f /secrets/searxng/settings.yml && echo present || echo MISSING)
          echo "secrets-vault certs=$$certs acme=$$acme internal_ca_key=$$ca vpn=$$vpn searxng=$$searx"
          if [ "$$ca" = "MISSING" ] || [ "$$vpn" = "MISSING" ]; then
            echo "secrets-vault ERROR: 再生成できない秘密が欠けている"
          fi
          sleep 900
        done

