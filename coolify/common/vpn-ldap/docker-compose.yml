# OpenVPN client + LDAP TCP forwarder.
#
# Connects to the CKK VPN (ckkhda.heinelt.info) and exposes the LDAP server at
# `vpn-ldap:389` on the segmented `ckk-ldap` network. Only apps that
# explicitly join that network (e.g. open-webui) can reach AD — the rest of the
# stack never touches the VPN/LDAP.
#
# ⚠️ **Coolify 管理**（プロジェクト ckk / `common` 環境）。
#
# 秘密の渡し方が 2 通りある:
#   - **設定値**（AD の DN / パスワード / VPN 資格情報 / DSN）は Coolify の環境変数。
#     以前は gitignore した `ldap.env` / `.env` を `env_file:` で読んでいたが、
#     Coolify は git からアプリを建てるので **git に無いファイルは存在しない**。
#     そのため全部 `environment:` に展開して Coolify 側で与える。
#   - **ファイル**（`config.ovpn` — CA と tls-auth を含む）は
#     `/data/ckk-secrets/vpn`（../secrets/README.md）から bind mount する。
#     Coolify は名前付きボリュームを `<appUUID>_<name>` へ改名するので、
#     共有したい実体は必ず bind mount にすること。

services:
  vpn-ldap:
    build: .
    image: vpn-ldap
    container_name: vpn-ldap
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun
    environment:
      - VPN_USERNAME=${VPN_USERNAME:?set VPN_USERNAME in .env}
      - VPN_PASSWORD=${VPN_PASSWORD:?set VPN_PASSWORD in .env}
      - LDAP_HOST=${LDAP_HOST:?set LDAP_HOST in .env}   # LDAP/AD server as seen via the VPN
      - LDAP_PORT=${LDAP_PORT:-389}
      - LISTEN_PORT=389
      # On a user login (bind that is not the service account) the forwarder POSTs
      # here so ldap-sync refreshes that user. LDAP_APP_DN (to skip) comes from ldap.env.
      - SYNC_TRIGGER_URL=http://ldap-sync:8088/sync
      # 束ねが公式アカウントかどうかの判定に使う（旧 ldap.env 由来）
      - LDAP_APP_DN=${LDAP_APP_DN:?set LDAP_APP_DN}
      # Authentik SSO bridge（任意）: VPN 内の IdP を coolify ネットへ中継
      - AUTHENTIK_HOST=${AUTHENTIK_HOST:-}
      - AUTHENTIK_PORT=${AUTHENTIK_PORT:-9000}
    volumes:
      # config.ovpn（CA + tls-auth 込み）。資格情報は環境変数から。
      - /data/ckk-secrets/vpn:/vpn:ro
    networks:
      default: {}          # ldap-sync との内部網
      # AD を読む相手を繋ぐ網（open-webui / metabase / admintools）。
      # なお下の `coolify` にも参加している（SSO の OIDC discovery で
      # `auth.ckk-tools.loc` を張るため）ので、:389 は coolify 網からも届く。
      ldap:
        aliases:
          - vpn-ldap
      # Coolify ビルドの nextjs-web からブラウザと同一の issuer ホスト名で
      # 到達できるよう alias を張る（SSO の OIDC discovery/token 用）
      coolify:
        aliases:
          - auth.ckk-tools.loc

  # AD/LDAP -> PostgreSQL employee directory sync. Periodic full sync + an HTTP
  # trigger (POST /sync, /sync/<user>) the forwarder calls on login. Writes the
  # shared `employee_directory` table (read by Metabase / v_labor / future apps).
  ldap-sync:
    build: ./sync
    image: ckk-ldap-sync
    container_name: ldap-sync
    restart: unless-stopped
    depends_on:
      - vpn-ldap
    environment:
      # 本番 DB `ckk-db-main`（role ldap_sync, search_path=directory,kot）。
      # DSN は .env（gitignore）。2026-08-24 に shared-db から本番 DB へ移した —
      # employee_directory はアプリのユーザー自動作成（provision_users_from_directory）
      # の入力なので、本番 DB に無いとユーザーが 1 人も作られない。
      - DATABASE_URL=${LDAP_SYNC_DB_URL:?set LDAP_SYNC_DB_URL in .env}
      - LDAP_SYNC_INTERVAL_SECONDS=${LDAP_SYNC_INTERVAL_SECONDS:-21600}
      # Python は TTY でないと stdout をバッファするので、これが無いと
      # `docker logs ldap-sync` が**空のまま**になる。同期が失敗しても何も出ず、
      # 原因を掴むのにコンテナ内で sync.full_sync() を直接呼ぶ羽目になった。
      - PYTHONUNBUFFERED=1
      # 旧 ldap.env の中身（Coolify の環境変数として与える）
      - LDAP_SERVER_LABEL=${LDAP_SERVER_LABEL:-CKK AD}
      - LDAP_SERVER_HOST=${LDAP_SERVER_HOST:?set LDAP_SERVER_HOST}
      - LDAP_SERVER_PORT=${LDAP_SERVER_PORT:-389}
      - LDAP_APP_DN=${LDAP_APP_DN:?set LDAP_APP_DN}
      - LDAP_APP_PASSWORD=${LDAP_APP_PASSWORD:?set LDAP_APP_PASSWORD}
      - LDAP_SEARCH_BASE=${LDAP_SEARCH_BASE:?set LDAP_SEARCH_BASE}
      - LDAP_ATTRIBUTE_FOR_USERNAME=${LDAP_ATTRIBUTE_FOR_USERNAME:-sAMAccountName}
      - LDAP_ATTRIBUTE_FOR_MAIL=${LDAP_ATTRIBUTE_FOR_MAIL:-mail}
      - LDAP_USE_TLS=${LDAP_USE_TLS:-false}
    networks:
      - default          # reach vpn-ldap:389
      - coolify          # reach ckk-db-main（Coolify アプリ — 別名で引く）

networks:
  default:
  ldap:
    external: true
    name: ckk-ldap
  coolify:
    external: true
    name: coolify
