t="20" rx="3" fill="#dcfce7" fill-opacity="0.8" stroke="#15803d" stroke-width="0.9" /><text x="677" y="363" text-anchor="middle" font-size="11" font-weight="600" font-family="'Noto Sans JP',sans-serif" fill="#15803d">足りる</text></g><g><rect x="708.5" y="858" width="51" height="20" rx="3" fill="#fee2e2" fill-opacity="0.8" stroke="#b91c1c" stroke-width="0.9" /><text x="734" y="873" text-anchor="middle" font-size="11" font-weight="600" font-family="'Noto Sans JP',sans-serif" fill="#b91c1c">差し戻し</text></g><g><path d="M 459 258 L 459 281" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#arrowhead)" /><path d="M 786 690 L 786 707 L 734 707 L 734 724" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#arrowhead)" /></g><g><path d="M 734 768 L 734 791" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#arrowhead)" /><path d="M 1001 1092 L 1001 1109 L 1219 1109 L 1219 1126" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#arrowhead)" /></g><text x="793" y="48" text-anchor="middle" fill="#0f172a" font-family="'Noto Sans JP','Noto Sans',sans-serif" font-size="24" font-weight="600" letter-spacing="0.05em">生産の流れ — 受注確定から完成まで</text></svg>
