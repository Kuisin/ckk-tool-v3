2="258" stroke="#9333ea" stroke-width="1.3" /><line x1="543" y1="214" x2="543" y2="258" stroke="#9333ea" stroke-width="1.3" /></g><svg x="383" y="228" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6b21a8" stroke-width="2"><path d="M15 6a9 9 0 0 0-9 9V3" /><circle cx="18" cy="6" r="3" /><circle cx="6" cy="18" r="3" /></svg><text x="467" y="241" text-anchor="middle" fill="#6b21a8" font-family="'Noto Sans JP',sans-serif" font-size="13" font-weight="500">在庫を照合</text></g><g><rect x="583" y="384" width="188" height="44" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.3" /><svg x="591" y="398" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1e40af" stroke-width="2"><path d="M4 14a1 1 0 0 1-.78-1.63l9.9-10.2a.5.5 0 0 1 .86.46l-1.92 6.02A1 1 0 0 0 13 10h7a1 1 0 0 1 .78 1.63l-9.9 10.2a.5.5 0 0 1-.86-.46l1.92-6.02A1 1 0 0 0 11 14z" /></svg><text x="685" y="411" text-anchor="middle" fill="#1e40af" font-family="'Noto Sans JP',sans-serif" font-size="13" font-weight="500">在庫分の指示書</text><g><title>指示書</title><path d="M 711 420 H 768 L 776 428 V 460 H 711 Z" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.1" /><path d="M 768 420 V 428 H 776" fill="none" stroke="#7c3aed" stroke-width="1" /><text x="741.5" y="432" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="9" fill="#5b21b6">指示書</text></g></g><g><g><rect x="365" y="484" width="188" height="44" rx="4" fill="#f3e8ff" stroke="#9333ea" stroke-width="1.3" /><line x1="375" y1="484" x2="375" y2="528" stroke="#9333ea" stroke-width="1.3" /><line x1="543" y1="484" x2="543" y2="528" stroke="#9333ea" stroke-width="1.3" /></g><svg x="383" y="498" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6b21a8" stroke-width="2"><path d="M15 6a9 9 0 0 0-9 9V3" /><circle cx="18" cy="6" r="3" /><circle cx="6" cy="18" r="3" /></svg><text x="467" y="511" text-anchor="middle" fill="#6b21a8" font-family="'Noto Sans JP',sans-serif" font-size="13" font-weight="500">素材を確認</text></g><g><rect x="692" y="564" width="188" height="44" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.3" /><svg x="700" y="578" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1e40af" stroke-width="2"><path d="M4 14a1 1 0 0 1-.78-1.63l9.9-10.2a.5.5 0 0 1 .86.46l-1.92 6.02A1 1 0 0 0 13 10h7a1 1 0 0 1 .78 1.63l-9.9 10.2a.5.5 0 0 1-.86-.46l1.92-6.02A1 1 0 0 0 11 14z" /></svg><text x="794" y="591" text-anchor="middle" fill="#1e40af" font-family="'Noto Sans JP',sans-serif" font-size="13" font-weight="500">製造分の指示書</text><g><title>指示書</title><path d="M 820 600 H 877 L 885 608 V 640 H 820 Z" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.1" /><path d="M 877 600 V 608 H 885" fill="none" stroke="#7c3aed" stroke-width="1" /><text x="850.5" y="612" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="9" fill="#5b21b6">指示書</text></g></g><g><rect x="640" y="724" width="188" height="44" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.3" /><svg x="648" y="738" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1e40af" stroke-width="2"><path d="M4 14a1 1 0 0 1-.78-1.63l9.9-10.2a.5.5 0 0 1 .86.46l-1.92 6.02A1 1 0 0 0 13 10h7a1 1 0 0 1 .78 1.63l-9.9 10.2a.5.5 0 0 1-.86-.46l1.92-6.02A1 1 0 0 0 11 14z" /></svg><text x="742" y="751" text-anchor="middle" fill="#1e40af" font-family="'Noto Sans JP',sans-serif" font-size="13" font-weight="500">承認を依頼する</text></g><g><polygon points="654,894 814,894 828,916 814,938 654,938 640,916" fill="#fee2e2" stroke="#dc2626" stroke-width="1.3" /><svg x="654" y="908" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#991b1b" stroke-width="2"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3" /><path d="M12 9v4" /><path d="M12 17h.01" /></svg><text x="742" y="921" text-anchor="middle" fill="#991b1b" font-family="'Noto Sans JP',sans-serif" font-size="13" font-weight="500">修正し再依頼する</text></g><g><rect x="907" y="986" width="188" height="44" rx="6" fill="#dcfce