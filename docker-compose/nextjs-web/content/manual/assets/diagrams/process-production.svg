<svg viewBox="0 0 1586 1412" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto;background:#ffffff;display:block" id="swimlane-svg"><defs><marker id="arrowhead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#334155" /></marker><pattern id="gridp" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M 24 0 L 0 0 0 24" fill="none" stroke="#e5e7eb" stroke-width="0.5" /></pattern></defs><rect x="40" y="84" width="1506" height="1304" fill="url(#gridp)" opacity="0.5" /><rect x="40" y="84" width="300" height="72" fill="white" opacity="0.9" /><text x="52" y="114" fill="#0f172a" font-family="'Noto Sans JP',sans-serif" font-size="13" font-weight="700">手順</text><text x="52" y="134" fill="#0f172a" opacity="0.7" font-family="'Noto Sans JP',sans-serif" font-size="11">説明</text><line x1="40" x2="340" y1="156" y2="156" stroke="#334155" stroke-width="1.2" vector-effect="non-scaling-stroke" /><rect x="40" y="84" width="300" height="1304" fill="none" stroke="#334155" stroke-width="1.2" vector-effect="non-scaling-stroke" /><g><text x="52" y="226" fill="#0f172a" font-family="'Noto Sans JP',sans-serif" font-size="12" font-weight="600">1. 在庫照合</text><text x="52" y="246" fill="#0f172a" opacity="0.78" font-family="'Noto Sans JP',sans-serif" font-size="10" font-weight="400"><tspan x="52" dy="0"><tspan font-weight="400" font-style="normal" text-decoration="none">在庫から出せる分と、新しく作る分に分ける。</tspan></tspan></text></g><g><text x="52" y="396" fill="#0f172a" font-family="'Noto Sans JP',sans-serif" font-size="12" font-weight="600">2. 在庫分</text><text x="52" y="416" fill="#0f172a" opacity="0.78" font-family="'Noto Sans JP',sans-serif" font-size="10" font-weight="400"><tspan x="52" dy="0"><tspan font-weight="400" font-style="normal" text-decoration="none">在庫分は固定構成（製品出し＋任意の出荷前検査）。在庫が</tspan></tspan><tspan x="52" dy="14"><tspan font-weight="400" font-style="normal" text-decoration="none">引き当てられる。</tspan></tspan></text></g><g><text x="52" y="496" fill="#0f172a" font-family="'Noto Sans JP',sans-serif" font-size="12" font-weight="600">3. 素材確認</text><text x="52" y="516" fill="#0f172a" opacity="0.78" font-family="'Noto Sans JP',sans-serif" font-size="10" font-weight="400"><tspan x="52" dy="0"><tspan font-weight="400" font-style="normal" text-decoration="none">必要な素材が足りるかを確認する。不足する場合は購買の流</tspan></tspan><tspan x="52" dy="14"><tspan font-weight="400" font-style="normal" text-decoration="none">れで調達する。</tspan></tspan></text></g><g><text x="52" y="576" fill="#0f172a" font-family="'Noto Sans JP',sans-serif" font-size="12" font-weight="600">4. 製造分</text><text x="52" y="596" fill="#0f172a" opacity="0.78" font-family="'Noto Sans JP',sans-serif" font-size="10" font-weight="400"><tspan x="52" dy="0"><tspan font-weight="400" font-style="normal" text-decoration="none">工程を順番に並べる。同じ受注元・製品の前回指示書があれ</tspan></tspan><tspan x="52" dy="14"><tspan font-weight="400" font-style="normal" text-decoration="none">ばコピーできる。</tspan></tspan></text></g><g><text x="52" y="736" fill="#0f172a" font-family="'Noto Sans JP',sans-serif" font-size="12" font-weight="600">5. 承認依頼</text><text x="52" y="756" fill="#0f172a" opacity="0.78" font-family="'Noto Sans JP',sans-serif" font-size="10" font-weight="400"><tspan x="52" dy="0"><tspan font-weight="400" font-style="normal" text-decoration="none">承認されるまで製造は始められない。段数は承認設定で決ま</tspan></tspan><tspan x="52" dy="14"><tspan font-weight="400" font-style="normal" text-decoration="none">る。</tspan></tspan></text></g><g><text x="52" y="906" fill="#0f172a" font-family="'Noto Sans JP',sans-serif" font-size="12" font-weight="600">6. 差し戻し</text></g><g><text x="52" y="998" fill="#0f172a" font-family="'Noto Sans JP',sans-serif" font-size="12" font-weight="600">7. 承認</text></g><g><text x="52" y="1138" fill="#0f172a" font-family="'Noto Sans JP',sans-serif" font-size="12" font-weight="600">8. 工程実行</text><text x="52" y="1158" fill="#0f172a" opacity="0.78" font-family="'Noto Sans JP',sans-serif" font-size="10" font-weight="400"><tspan x="52" dy="0"><tspan font-weight="400" font-style="normal" text-decoration="none">工程ごとに開始・完了と、受入数・良品数・不良の内訳を記</tspan></tspan><tspan x="52" dy="14"><tspan font-weight="400" font-style="normal" text-decoration="none">録する。不良は工程分岐で手直しできる。</tspan></tspan></text></g><g><text x="52" y="1218" fill="#0f172a" font-family="'Noto Sans JP',sans-serif" font-size="12" font-weight="600">9. 完成</text></g><g><text x="52" y="1298" fill="#0f172a" font-family="'Noto Sans JP',sans-serif" font-size="12" font-weight="600">10. 入庫</text><text x="52" y="1318" fill="#0f172a" opacity="0.78" font-family="'Noto Sans JP',sans-serif" font-size="10" font-weight="400"><tspan x="52" dy="0"><tspan font-weight="400" font-style="normal" text-decoration="none">完成した数が製品在庫に入り、注文への引き当てが確定する</tspan></tspan><tspan x="52" dy="14"><tspan font-weight="400" font-style="normal" text-decoration="none">。出荷の流れへ進める。</tspan></tspan></text></g><g><rect x="340" y="84" width="228" height="1304" fill="#d1fae5" opacity="0.12" /><rect x="340" y="84" width="228" height="72" fill="#d1fae5" opacity="0.9" /><text x="454" y="126" text-anchor="middle" fill="#065f46" font-family="'Noto Sans JP',sans-serif" font-size="15" font-weight="700" letter-spacing="0.06em">生産管理</text><line x1="340" x2="568" y1="156" y2="156" stroke="#334155" stroke-width="1.2" vector-effect="non-scaling-stroke" /></g><g><rect x="568" y="84" width="324" height="1304" fill="#fef3c7" opacity="0.12" /><rect x="568" y="84" width="324" height="72" fill="#fef3c7" opacity="0.9" /><text x="730" y="126" text-anchor="middle" fill="#92400e" font-family="'Noto Sans JP',sans-serif" font-size="15" font-weight="700" letter-spacing="0.06em">社内営業補助</text><line x1="568" x2="892" y1="156" y2="156" stroke="#334155" stroke-width="1.2" vector-effect="non-scaling-stroke" /></g><g><rect x="892" y="84" width="218" height="1304" fill="#f0fdf4" opacity="0.12" /><rect x="892" y="84" width="218" height="72" fill="#f0fdf4" opacity="0.9" /><text x="1001" y="126" text-anchor="middle" fill="#166534" font-family="'Noto Sans JP',sans-serif" font-size="15" font-weight="700" letter-spacing="0.06em">承認・判断</text><line x1="892" x2="1110" y1="156" y2="156" stroke="#334155" stroke-width="1.2" vector-effect="non-scaling-stroke" /></g><g><rect x="1110" y="84" width="218" height="1304" fill="#ccfbf1" opacity="0.12" /><rect x="1110" y="84" width="218" height="72" fill="#ccfbf1" opacity="0.9" /><text x="1219" y="126" text-anchor="middle" fill="#134e4a" font-family="'Noto Sans JP',sans-serif" font-size="15" font-weight="700" letter-spacing="0.06em">製造</text><line x1="1110" x2="1328" y1="156" y2="156" stroke="#334155" stroke-width="1.2" vector-effect="non-scaling-stroke" /></g><g><rect x="1328" y="84" width="218" height="1304" fill="#eef2ff" opacity="0.12" /><rect x="1328" y="84" width="218" height="72" fill="#eef2ff" opacity="0.9" /><g><circle cx="1356" cy="120" r="16" fill="#ffffff" stroke="#3730a3" stroke-width="1.2" /><svg x="1345" y="109" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#3730a3" stroke-width="2"><ellipse cx="12" cy="5" rx="9" ry="3" /><path d="M3 5V19A9 3 0 0 0 21 19V5" /><path d="M3 12A9 3 0 0 0 21 12" /></svg></g><text x="1382" y="126" text-anchor="start" fill="#3730a3" font-family="'Noto Sans JP',sans-serif" font-size="15" font-weight="700" letter-spacing="0.06em">システム</text><line x1="1328" x2="1546" y1="156" y2="156" stroke="#334155" stroke-width="1.2" vector-effect="non-scaling-stroke" /></g><line x1="40" y1="366" x2="1546" y2="366" stroke="#e5e7eb" stroke-width="1" vector-effect="non-scaling-stroke" opacity="0.95" /><line x1="40" y1="466" x2="1546" y2="466" stroke="#e5e7eb" stroke-width="1" vector-effect="non-scaling-stroke" opacity="0.95" /><line x1="40" y1="546" x2="1546" y2="546" stroke="#e5e7eb" stroke-width="1" vector-effect="non-scaling-stroke" opacity="0.95" /><line x1="40" y1="646" x2="1546" y2="646" stroke="#e5e7eb" stroke-width="1" vector-effect="non-scaling-stroke" opacity="0.95" /><line x1="40" y1="706" x2="1546" y2="706" stroke="#e5e7eb" stroke-width="1" vector-effect="non-scaling-stroke" opacity="0.95" /><line x1="40" y1="876" x2="1546" y2="876" stroke="#e5e7eb" stroke-width="1" vector-effect="non-scaling-stroke" opacity="0.95" /><line x1="40" y1="968" x2="1546" y2="968" stroke="#e5e7eb" stroke-width="1" vector-effect="non-scaling-stroke" opacity="0.95" /><line x1="40" y1="1048" x2="1546" y2="1048" stroke="#e5e7eb" stroke-width="1" vector-effect="non-scaling-stroke" opacity="0.95" /><line x1="40" y1="1108" x2="1546" y2="1108" stroke="#e5e7eb" stroke-width="1" vector-effect="non-scaling-stroke" opacity="0.95" /><line x1="40" y1="1188" x2="1546" y2="1188" stroke="#e5e7eb" stroke-width="1" vector-effect="non-scaling-stroke" opacity="0.95" /><line x1="40" y1="1268" x2="1546" y2="1268" stroke="#e5e7eb" stroke-width="1" vector-effect="non-scaling-stroke" opacity="0.95" /><rect x="340" y="84" width="1206" height="1304" fill="none" stroke="#334155" stroke-width="1.2" vector-effect="non-scaling-stroke" /><line x1="568" x2="568" y1="84" y2="1388" stroke="#334155" stroke-width="1.2" vector-effect="non-scaling-stroke" /><line x1="892" x2="892" y1="84" y2="1388" stroke="#334155" stroke-width="1.2" vector-effect="non-scaling-stroke" /><line x1="1110" x2="1110" y1="84" y2="1388" stroke="#334155" stroke-width="1.2" vector-effect="non-scaling-stroke" /><line x1="1328" x2="1328" y1="84" y2="1388" stroke="#334155" stroke-width="1.2" vector-effect="non-scaling-stroke" /><g><path d="M 459 281 L 529 306 L 459 331 L 389 306 Z" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8" /><text x="459" y="310" text-anchor="middle" font-family="'Noto Sans JP',sans-serif" font-size="13" font-weight="600" fill="#2563eb">製品在庫</text><g><path d="M 459 331 L 459 341 L 677 341 L 677 384" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#arrowhead)" /></g><g><path d="M 459 331 L 459 484" fill="none" stroke="#334155" stroke-width="1.6" marker-end="ur