<svg viewBox="0 0 925 1010" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto;background:#ffffff;display:block" id="swimlane-svg"><defs><marker id="arrowhead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#334155" /></marker><pattern id="gridp" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M 24 0 L 0 0 0 24" fill="none" stroke="#e5e7eb" stroke-width="0.5" /></pattern></defs><rect x="40" y="84" width="845" height="902" fill="url(#gridp)" opacity="0.5" /><rect x="40" y="84" width="300" height="72" fill="white" opacity="0.9" /><text x="52" y="114" fill="#0f172a" font-family="'Noto Sans JP',sans-serif" font-size="13" font-weight="700">手順</text><text x="52" y="134" fill="#0f172a" opacity="0.7" font-family="'Noto Sans JP',sans-serif" font-size="11">説明</text><line x1="40" x2="340" y1="156" y2="156" stroke="#334155" stroke-width="1.2" vector-effect="non-scaling-stroke" /><rect x="40" y="84" width="300" height="902" fill="none" stroke="#334155" stroke-width="1.2" vector-effect="non-scaling-stroke" /><g><text x="52" y="226" fill="#0f172a" font-family="'Noto Sans JP',sans-serif" font-size="12" font-weight="600">1. 出荷書</text><text x="52" y="246" fill="#0f172a" opacity="0.78" font-family="'Noto Sans JP',sans-serif" font-size="10" font-weight="400"><tspan x="52" dy="0"><tspan font-weight="400" font-style="normal" text-decoration="none">注文請書を選ぶと出荷できる注文明細が入る。出すロットと</tspan></tspan><tspan x="52" dy="14"><tspan font-weight="400" font-style="normal" text-decoration="none">数量、出荷元拠点を決める。</tspan></tspan></text></g><g><text x="52" y="326" fill="#0f172a" font-family="'Noto Sans JP',sans-serif" font-size="12" font-weight="600">2. 確定</text><text x="52" y="346" fill="#0f172a" opacity="0.78" font-family="'Noto Sans JP',sans-serif" font-size="10" font-weight="400"><tspan x="52" dy="0"><tspan font-weight="400" font-style="normal" text-decoration="none">内容を確定し、出荷できる状態にする。</tspan></tspan></text></g><g><text x="52" y="406" fill="#0f172a" font-family="'Noto Sans JP',sans-serif" font-size="12" font-weight="600">3. 出荷</text><text x="52" y="426" fill="#0f172a" opacity="0.78" font-family="'Noto Sans JP',sans-serif" font-size="10" font-weight="400"><tspan x="52" dy="0"><tspan font-weight="400" font-style="normal" text-decoration="none">実際に送り出したら「出荷」にする。</tspan></tspan></text></g><g><text x="52" y="486" fill="#0f172a" font-family="'Noto Sans JP',sans-serif" font-size="12" font-weight="600">4. 在庫反映</text><text x="52" y="506" fill="#0f172a" opacity="0.78" font-family="'Noto Sans JP',sans-serif" font-size="10" font-weight="400"><tspan x="52" dy="0"><tspan font-weight="400" font-style="normal" text-decoration="none">出荷元拠点の在庫が減り、注文明細の状態が「一部出荷」ま</tspan></tspan><tspan x="52" dy="14"><tspan font-weight="400" font-style="normal" text-decoration="none">たは「出荷済」に変わる。</tspan></tspan></text></g><g><text x="52" y="656" fill="#0f172a" font-family="'Noto Sans JP',sans-serif" font-size="12" font-weight="600">5. 納品書</text><text x="52" y="676" fill="#0f172a" opacity="0.78" font-family="'Noto Sans JP',sans-serif" font-size="10" font-weight="400"><tspan x="52" dy="0"><tspan font-weight="400" font-style="normal" text-decoration="none">納品方法（通常納品・ユーザー直送）と価格記載の有無を決</tspan></tspan><tspan x="52" dy="14"><tspan font-weight="400" font-style="normal" text-decoration="none">めて発行する。</tspan></tspan></text></g><g><text x="52" y="756" fill="#0f172a" font-family="'Noto Sans JP',sans-serif" font-size="12" font-weight="600">6. 納品</text><text x="52" y="776" fill="#0f172a" opacity="0.78" font-family="'Noto Sans JP',sans-serif" font-size="10" font-weight="400"><tspan x="52" dy="0"><tspan font-weight="400" font-style="normal" text-decoration="none">届いたら「納品済」にする。ここまで済んだ出荷が請求の対</tspan></tspan><tspan x="52" dy="14"><tspan font-weight="400" font-style="normal" text-decoration="none">象になる。</tspan></tspan></text></g><g><text x="52" y="836" fill="#0f172a" font-family="'Noto Sans JP',sans-serif" font-size="12" font-weight="600">7. 在庫保管</text><text x="52" y="856" fill="#0f172a" opacity="0.78" font-family="'Noto Sans JP',sans-serif" font-size="10" font-weight="400"><tspan x="52" dy="0"><tspan font-weight="400" font-style="normal" text-decoration="none">予備製作分を社内に置いておく種別。請求には進まない。</tspan></tspan></text></g><g><rect x="340" y="84" width="327" height="902" fill="#ffedd5" opacity="0.12" /><rect x="340" y="84" width="327" height="72" fill="#ffedd5" opacity="0.9" /><text x="503.5" y="126" text-anchor="middle" fill="#9a3412" font-family="'Noto Sans JP',sans-serif" font-size="15" font-weight="700" letter-spacing="0.06em">出荷担当</text><line x1="340" x2="667" y1="156" y2="156" stroke="#334155" stroke-width="1.2" vector-effect="non-scaling-stroke" /></g><g><rect x="667" y="84" width="218" height="902" fill="#eef2ff" opacity="0.12" /><rect x="667" y="84" width="218" height="72" fill="#eef2ff" opacity="0.9" /><g><circle cx="695" cy="120" r="16" fill="#ffffff" stroke="#3730a3" stroke-width="1.2" /><svg x="684" y="109" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#3730a3" stroke-width="2"><ellipse cx="12" cy="5" rx="9" ry="3" /><path d="M3 5V19A9 3 0 0 0 21 19V5" /><path d="M3 12A9 3 0 0 0 21 12" /></svg></g><text x="721" y="126" text-anchor="start" fill="#3730a3" font-family="'Noto Sans JP',sans-serif" font-size="15" font-weight="700" letter-spacing="0.06em">システム</text><line x1="667" x2="885" y1="156" y2="156" stroke="#334155" stroke-width="1.2" vector-effect="non-scaling-stroke" /></g><line x1="40" y1="296" x2="885" y2="296" stroke="#e5e7eb" stroke-width="1" vector-effect="non-scaling-stroke" opacity="0.95" /><line x1="40" y1="376" x2="885" y2="376" stroke="#e5e7eb" stroke-width="1" vector-effect="non-scaling-stroke" opacity="0.95" /><line x1="40" y1="456" x2="885" y2="456" stroke="#e5e7eb" stroke-width="1" vector-effect="non-scaling-stroke" opacity="0.95" /><line x1="40" y1="626" x2="885" y2="626" stroke="#e5e7eb" stroke-width="1" vector-effect="non-scaling-stroke" opacity="0.95" /><line x1="40" y1="726" x2="885" y2="726" stroke="#e5e7eb" stroke-width="1" vector-effect="non-scaling-stroke" opacity="0.95" /><line x1="40" y1="806" x2="885" y2="806" stroke="#e5e7eb" stroke-width="1" vector-effect="non-scaling-stroke" opacity="0.95" /><line x1="40" y1="946" x2="885" y2="946" stroke="#e5e7eb" stroke-width="1" vector-effect="non-scaling-stroke" opacity="0.95" /><rect x="340" y="84" width="545" height="902" fill="none" stroke="#334155" stroke-width="1.2" vector-effect="non-scaling-stroke" /><line x1="667" x2="667" y1="84" y2="986" stroke="#334155" stroke-width="1.2" vector-effect="non-scaling-stroke" /><g><path d="M 776 541 L 846 566 L 776 591 L 706 566 Z" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8" /><text x="776" y="570" text-anchor="middle" font-family="'Noto Sans JP',sans-serif" font-size="13" font-weight="600" fill="#2563eb">種別</text><g><path d="M 776 591 L 776 601 L 449 601 L 449 644" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#arrowhead)" /></g><g><path d="M 776 591 L 776 601 L 558 601 L 558 824" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#arrowhead)" /></g><path d="M 449 788 L 449 888 L 558 888 L 558 902" fill="none" stroke="#334155" stroke-width="1.6" /><path d="M 558 868 L 558 888 L 558 888 L 558 902" fill="none" stroke="#334155" stroke-width="1.6" /><path d="M 558 902 L 578 916 L 558 930 L 538 916 Z" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6" /></g><line x1="503.5" y1="258" x2="503.5" y2="314" stroke="#334155" stroke-width="1.6" marker-end="url(#arrowhead)" /><line x1="503.5" y1="358" x2="503.5" y2="394" stroke="#334155" stroke-width="1.6" marker-end="url(#arrowhead)" /><path d="M 503.5 438 L 503.5 456 L 776 456 L 776 474" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#arrowhead)" /><line x1="449" y1="688" x2="449" y2="744" stroke="#334155" stroke-width="1.6" marker-end="url(#arrowhead)" /><line x1="503.5" y1="191" x2="503.5" y2="214" stroke="#334155" stroke-width="1.6" marker-end="url(#arrowhead)" /><circle cx="503.5" cy="186" r="5" fill="#334155" /><line x1="558" y1="930" x2="558" y2="953" stroke="#334155" stroke-width="1.6" marker-end="url(#arrowhead)" /><circle cx="558" cy="958" r="5" fill="#334155" /><g><rect x="409.5" y="214" width="188" height="44" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.3" /><svg x="417.5" y="228" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1e40af" stroke-width="2"><path d="M4 14a1 1 0 0 1-.78-1.63l9.9-10.2a.5.5 0 0 1 .86.46l-1.92 6.02A1 1 0 0 0 13 10h7a1 1 0 0 1 .78 1.63l-9.9 10.2a.5.5 0 0 1-.86-.46l1.92-6.02A1 1 0 0 0 11 14z" /></svg><text x="511.5" y="241" text-anchor="middle" fill="#1e40af" font-family="'Noto Sans JP',sans-serif" font-size="13" font-weight="500">出荷書を作成する</text><g><title>出荷書</title><path d="M 537.5 250 H 594.5 L 602.5 258 V 290 H 537.5 Z" fill="#fff7ed" stroke="#ea580c" stroke-width="1.1" /><path d="M 594.5 250 V 258 H 602.5" fill="none" stroke="#ea580c" stroke-width="1" /><text x="568" y="262" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="9" fill="#9a3412">出荷書</text></g></g><g><rect x="409.5" y="314" width="188" height="44" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.3" /><svg x="417.5" y="328" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1e40af" stroke-width="2"><path d="M4 14a1 1 0 0 1-.78-1.63l9.9-10.2a.5.5 0 0 1 .86.46l-1.92 6.02A1 1 0 0 0 13 10h7a1 1 0 0 1 .78 1.63l-9.9 10.2a.5.5 0 0 1-.86-.46l1.92-6.02A1 1 0 0 0 11 14z" /></svg><text x="511.5" y="341" text-anchor="middle" fill="#1e40af" font-family="'Noto Sans JP',sans-serif" font-size="13" font-weight="500">出荷書を確定する</text></g><g><rect x="409.5" y="394" width="188" height="44" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.3" /><svg x="417.5" y="408" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1e40af" stroke-width="2"><path d="M4 14a1 1 0 0 1-.78-1.63l9.9-10.2a.5.5 0 0 1 .86.46l-1.92 6.02A1 1 0 0 0 13 10h7a1 1 0 0 1 .78 1.63l-9.9 10.2a.5.5 0 0 1-.86-.46l1.92-6.02A1 1 0 0 0 11 14z" /></svg><text x="511.5" y="421" text-anchor="middle" fill="#1e40af" font-family="'Noto Sans JP',sans-serif" font-size="13" font-weight="500">出荷を記録する</text></g><g><rect x="682" y="474" width="188" height="44" fill="#e0e7ff" stroke="#4f46e5" stroke-width="1.3" /><svg x="690" y="488" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#3730a3" stroke-width="2"><ellipse cx="12" cy="5" rx="9" ry="3" /><path d="M3 5V19A9 3 0 0 0 21 19V5" /><path d="M3 12A9 3 0 0 0 21 12" /></svg><text x="784" y="501" text-anchor="middle" fill="#3730a3" font-family="'Noto Sans JP',sans-serif" font-size="13" font-weight="500">在庫を減らす</text></g><g><rect x="355" y="644" width="188" height="44" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.3" /><svg x="363" y="658" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1e40af" stroke-width="2"><path d="M4 14a1 1 0 0 1-.78-1.63l9.9-10.2a.5.5 0 0 1 .86.46l-1.92 6.02A1 1 0 0 0 13 10h7a1 1 0 0 1 .78 1.63l-9.9 10.2a.5.5 0 0 1-.86-.46l1.92-6.02A1 1 0 0 0 11 14z" /></svg><text x="457" y="671" text-anchor="middle" fill="#1e40af" font-family="'Noto Sans JP',sans-serif" font-size="13" font-weight="500">納品書を発行する</text><g><title>納品書</title><path d="M 483 680 H 540 L 548 688 V 720 H 483 Z" fill="#fff7ed" stroke="#ea580c" stroke-width="1.1" /><path d="M 540 680 V 688 H 548" fill="none" stroke="#ea580c" stroke-width="1" /><text x="513.5" y="692" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="9" fill="#9a3412">納品書</text></g></g><g><rect x="355" y="744" width="188" height="44" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.3" /><svg x="363" y="758" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1e40af" stroke-width="2"><path d="M4 14a1 1 0 0 1-.78-1.63l9.9-10.2a.5.5 0 0 1 .86.46l-1.92 6.02A1 1 0 0 0 13 10h7a1 1 0 0 1 .78 1.63l-9.9 10.2a.5.5 0 0 1-.86-.46l1.92-6.02A1 1 0 0 0 11 14z" /></svg><text x="457" y="771" text-anchor="middle" fill="#1e40af" font-family="'Noto Sans JP',sans-serif" font-size="13" font-weight="500">納品済にする</text></g><g><polygon points="478,824 638,824 652,846 638,868 478,868 464,846" fill="#f4f4f5" stroke="#71717a" stroke-width="1.3" /><svg x="478" y="838" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#52525b" stroke-width="2"><circle cx="12" cy="12" r="10" /><path d="M12 6v6l4 2" /></svg><text x="566" y="851" text-anchor="middle" fill="#52525b" font-family="'Noto Sans JP',sans-serif" font-size="13" font-weight="500">社内に保管する</text></g><g><rect x="432" y="608" width="34" height="20" rx="3" fill="#ffedd5" fill-opacity="0.8" stroke="#c2410c" stroke-width="0.9" /><text x="449" y="623" text-anchor="middle" font-size="11" font-weight="600" font-family="'Noto Sans JP',sans-serif" fill="#c2410c">発送</text></g><g><path d="M 776 518 L 776 541" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#arrowhead)" /></g><text x="462.5" y="48" text-anchor="middle" fill="#0f172a" font-family="'Noto Sans JP','Noto Sans',sans-serif" font-size="24" font-weight="600" letter-spacing="0.05em">出荷の流れ — 出荷書から納品まで</text></svg>
