<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>QRカード印刷</title>
  <style>
    /*
     * QR カードシート（SY08）— A4 縦 210×297mm。
     * 余白: 上下 11mm / 左右 14mm（Gotenberg 側余白は 0 — .sheet の padding で確保）。
     * カード = 日本名刺サイズ 91×55mm を隙間なしで 2 列 × 5 行 = 10 枚/頁
     * （210 − 14×2 = 182 = 91×2、297 − 11×2 = 275 = 55×5 でぴったり収まる）。
     * 断裁ガイド: 各カードの四隅にトリム線交点を中心とした十字線
     * （カード面へ 3mm 重なり、外側へ 3mm 延長）。
     */
    @page { size: A4 portrait; margin: 0; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { background: #ffffff; color: #000000; }
    body {
      font-family: "Noto Sans JP", "Hiragino Sans", "Yu Gothic", sans-serif;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }
    .sheet {
      width: 210mm;
      height: 297mm;
      padding: 11mm 14mm;
      overflow: hidden;
      position: relative;
    }
    .sheet + .sheet { page-break-before: always; }
    .grid {
      display: grid;
      grid-template-columns: repeat(2, 91mm);
      grid-auto-rows: 55mm;
    }
    .cell {
      position: relative;
      width: 91mm;
      height: 55mm;
    }
    .card {
      width: 100%;
      height: 100%;
      padding: 5mm 5mm 3.5mm;
      display: flex;
      gap: 4mm;
      align-items: center;
      position: relative;
      overflow: hidden;
    }
    /*
     * 十字トンボ: トリム線の交点（カードの角）を中心に、水平・垂直の線を
     * カード面へ重ねて描く（各方向 3mm = 全長 6mm、太さ 0.2mm）。
     * 隣接セルの十字は同一位置に重なるだけなので二重描画で問題ない。
     */
    .crop { position: absolute; width: 0; height: 0; }
    .crop::before,
    .crop::after {
      content: "";
      position: absolute;
      background: #888888;
    }
    .crop::before { width: 6mm; height: 0.2mm; left: -3mm; top: -0.1mm; }
    .crop::after { width: 0.2mm; height: 6mm; left: -0.1mm; top: -3mm; }
    .crop-tl { top: 0; left: 0; }
    .crop-tr { top: 0; left: 91mm; }
    .crop-bl { top: 55mm; left: 0; }
    .crop-br { top: 55mm; left: 91mm; }
    .qr { flex-shrink: 0; }
    .qr svg { width: 36mm; height: 36mm; display: block; }
    .head {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 2.5mm;
      min-width: 0;
    }
    .company { font-size: 8pt; color: #444444; }
    .user { font-size: 13pt; font-weight: 700; overflow-wrap: anywhere; }
    /* 未割当カード: 割当後に氏名を手書きする記名線 */
    .user-line { display: block; height: 9mm; border-bottom: 0.35mm solid #333333; }
    /* カード識別 No.（SY08 一覧のマスク表示末尾と一致 — 整理・照合用） */
    .shortcode {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 10pt;
      font-weight: 700;
      letter-spacing: 0.02em;
    }
    .full-id {
      position: absolute;
      right: 5mm;
      bottom: 2.5mm;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 6.5pt;
      color: #777777;
    }
  </style>
</head>
<body>
{{pages}}
</body>
</html>
