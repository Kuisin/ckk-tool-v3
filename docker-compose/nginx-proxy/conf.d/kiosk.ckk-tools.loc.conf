# kiosk.ckk-tools.loc -> nextjs-kiosk MAIN app (kiosk-main:3000 relay -> Coolify :3007).
#
# 社内専用のアドレス。キオスクは現場タブレット専用なので、将来は
# **社内ネットワークからのみ**到達できるようにする方針で、Cloudflare の
# トンネルには載せない（公開しない）。
#
# TLS: `.loc` は公開 TLD ではないため Let's Encrypt を取れない → **自己署名**。
#   生成（サーバー上・certs/ は gitignore）:
#     cd ~/stacks/nginx-proxy/certs
#     openssl req -x509 -newkey rsa:2048 -nodes -days 3650 \
#       -keyout kiosk.ckk-tools.loc.key -out kiosk.ckk-tools.loc.crt \
#       -subj "/CN=kiosk.ckk-tools.loc" \
#       -addext "subjectAltName=DNS:kiosk.ckk-tools.loc" \
#       -addext "basicConstraints=critical,CA:FALSE" \
#       -addext "keyUsage=critical,digitalSignature,keyEncipherment" \
#       -addext "extendedKeyUsage=serverAuth"
#     chmod 600 kiosk.ckk-tools.loc.key
#
# 前提:
#   - 社内 DNS で kiosk.ckk-tools.loc -> 192.168.50.15（ckk-tools.loc は AD の
#     ドメインなので AD DNS に A レコードを足す）。
#   - **Android のキオスクアプリは自己署名証明書を拒否する**
#     （AndroidManifest に network_security_config が無く、onReceivedSslError も
#     握っていない）。タブレットから使うには、この証明書を信頼させる設定
#     （network_security_config.xml + アプリ再ビルド）か、社内 CA の導入が要る。
#     ブラウザからは警告を承認すれば開ける。

server {
    listen 80;
    listen [::]:80;
    server_name kiosk.ckk-tools.loc;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name kiosk.ckk-tools.loc;

    ssl_certificate     /etc/nginx/certs/kiosk.ckk-tools.loc.crt;
    ssl_certificate_key /etc/nginx/certs/kiosk.ckk-tools.loc.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    client_max_body_size 20m;

    location / {
        proxy_pass http://kiosk-main:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket (/api/kiosk/ws) upgrade passthrough.
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 300s;
    }
}
