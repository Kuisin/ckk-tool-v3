<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>messages editor</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <header id="topbar">
      <div id="title-row">
        <h1>messages editor</h1>
        <span id="dir-label"></span>
        <span id="save-status" class="status-idle">読み込み中…</span>
      </div>
      <div id="toolbar">
        <input id="search" type="search" placeholder="キー・値で絞り込み…" />
        <button id="expand-all" type="button">すべて開く</button>
        <button id="collapse-all" type="button">すべて畳む</button>
        <button id="add-root-group" type="button">+ 名前空間</button>
        <button id="reload" type="button">再読み込み</button>
      </div>
      <div id="warnings"></div>
    </header>
    <main>
      <table id="tree-table">
        <thead>
          <tr id="header-row"></tr>
        </thead>
        <tbody id="tree-body"></tbody>
      </table>
    </main>
    <script src="/app.js"></script>
  </body>
</html>
